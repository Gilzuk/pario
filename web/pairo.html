<title>Pairo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap">
<style>
  /* Single-look game screen: the Pairo purple-to-pink table, drawn on one canvas. */
  :root {
    --g1: #5738DB;
    --g2: #F0578C;
    --ink: #331F73;
    --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
    background: linear-gradient(135deg, var(--g1), var(--g2)) fixed;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, var(--g1), var(--g2)) fixed;
    color: #fff;
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px #fff; }
</style>

<canvas id="game" tabindex="0" aria-label="Pairo game. Find the one symbol two cards share."></canvas>

<script>
(() => {
  "use strict";

  const REDUCED = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;

  // ------------------------------------------------------------ Core (same rules as the Android app)
  // A deck is the finite projective plane of prime order n: n²+n+1 cards with n+1 symbols each,
  // and any two cards share exactly one symbol. Levels use n = 2, 3, 5 and 7.
  function buildDeck(n) {
    const out = [];
    for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
      const c = [];
      for (let x = 0; x < n; x++) c.push(n * x + (a * x + b) % n);
      c.push(n * n + a);
      out.push(c);
    }
    for (let c0 = 0; c0 < n; c0++) {
      const c = [];
      for (let y = 0; y < n; y++) c.push(n * c0 + y);
      c.push(n * n + n);
      out.push(c);
    }
    const inf = [];
    for (let i = 0; i <= n; i++) inf.push(n * n + i);
    out.push(inf);
    return { order: n, cards: out };
  }
  const DECKS = { 2: buildDeck(2), 3: buildDeck(3), 5: buildDeck(5), 7: buildDeck(7) };
  const FULL = DECKS[7];
  const SYMBOLS = 57;
  const shared = (deck, a, b) => deck.cards[a].find(x => deck.cards[b].includes(x));
  const now = () => performance.now();
  const LONG_AGO = -1e12;
  const rand = Math.random;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  class Dealer {
    constructor(deck) { this.deck = deck; this.pile = []; }
    draw(...inPlay) {
      for (;;) {
        if (!this.pile.length) this.pile = shuffle([...this.deck.cards.keys()]);
        const next = this.pile.pop();
        if (!inPlay.includes(next)) return next;
      }
    }
  }

  /** Places a card's symbols. Fewer symbols are drawn bigger; "tiny" widens the size range. */
  function layout(symbols, tiny) {
    const syms = shuffle([...symbols]), k = syms.length;
    const base = rand() * 2 * Math.PI;
    const mul = k >= 8 ? 1 : k >= 6 ? 1.15 : k === 4 ? 1.4 : 1.5;
    const ringOnly = k <= 4;
    const ringR = k === 3 ? 0.24 : k === 4 ? 0.26 : k === 6 ? 0.3 : 0.29;
    const ring = ringOnly ? k : k - 1;
    const size = (lo, hi) => (tiny ? lo * 0.6 + rand() * (hi * 1.25 - lo * 0.6) : lo + rand() * (hi - lo)) * mul;
    return syms.map((s, i) => {
      const rot = rand() * 2 * Math.PI;
      if (!ringOnly && i === 0) return { symbol: s, x: 0, y: 0, size: size(0.21, 0.26), rot };
      const j = ringOnly ? i : i - 1;
      const ang = base + j * 2 * Math.PI / ring + (rand() - 0.5) * 0.2;
      const rad = ringR + rand() * 0.03;
      return { symbol: s, x: rad * Math.cos(ang), y: rad * Math.sin(ang), size: size(0.14, 0.19), rot };
    });
  }

  /**
   * Wheel cards: 3 symbols on an inner ring and 5 on an outer ring that turn in opposite
   * directions. The rings sit far enough apart that symbols never touch at any angle.
   */
  const WHEEL_R = [0, 0.15, 0.34];
  function layoutWheel(symbols) {
    const syms = shuffle([...symbols]);
    const counts = [0, 3, 5], slots = [];
    let i = 0;
    for (const ring of [1, 2]) {
      const base = rand() * 2 * Math.PI;
      for (let j = 0; j < counts[ring]; j++, i++) {
        const ang = base + j * 2 * Math.PI / counts[ring];
        slots.push({ symbol: syms[i], ring, x: WHEEL_R[ring] * Math.cos(ang), y: WHEEL_R[ring] * Math.sin(ang),
          size: 0.15 + rand() * 0.03, rot: rand() * 2 * Math.PI });
      }
    }
    return slots;
  }

  /** A slot's position on its card, in card units, after its ring has turned. */
  function slotXY(card, s) {
    if (!card.wheel || !s.ring) return [s.x, s.y];
    const a = card.ringAngle[s.ring] * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    return [s.x * c - s.y * n, s.x * n + s.y * c];
  }

  function makeCard(deck, index, cfg = {}) {
    const wheel = !!cfg.wheels && deck.order === 7;
    return {
      index, symbols: deck.cards[index], slots: wheel ? layoutWheel(deck.cards[index]) : layout(deck.cards[index], cfg.tiny),
      wheel, ringAngle: [0, rand() * 360, rand() * 360],
      // Inner ring turns one way, outer ring the other (degrees per second at speed 1).
      ringSpeed: [0, (rand() < 0.5 ? 1 : -1) * (24 + rand() * 8), 0],
      born: now(), flyAt: LONG_AGO, flyFrom: -1,
      // Spinning cards (degrees per second) and reshuffle timing.
      spin: cfg.spin ? (rand() < 0.5 ? -1 : 1) * (14 + rand() * 10) : 0,
      angle: cfg.spin ? rand() * 360 : 0,
      layoutAt: now() - rand() * 1300
    };
  }
  function initRingSpeeds(card) {
    if (card.wheel) card.ringSpeed[2] = -Math.sign(card.ringSpeed[1]) * (16 + rand() * 6);
    return card;
  }

  const TARGET = 10, FREEZE_MS = 1500;
  const COUNTDOWN_S = 3, FLY_MS = 320, LEAVE_MS = 260, RESHUFFLE_MS = 2600;

  // ------------------------------------------------------------ Levels
  const SPRINT = { name: "Solo Sprint", order: 7, seconds: 60, penalty: 3, goal: 0, bestKey: "pairo.bestSolo" };
  const WHEELS = { name: "Wheels", order: 7, seconds: 60, penalty: 3, goal: 0, wheels: true, bestKey: "pairo.bestWheels" };
  /** Wheels speed up as you score: x1 at the start, +8% per match, at most x2.6. */
  const wheelSpeed = score => Math.min(2.6, 1 + score * 0.08);
  const BESTS = {};
  const LEVELS = [
    { name: "Warm-up", order: 2, seconds: 30, goal: 8, tip: "Three symbols per card." },
    { name: "Four's Company", order: 3, seconds: 30, goal: 8, tip: "Four symbols per card." },
    { name: "Six Sense", order: 5, seconds: 40, goal: 8, tip: "Six symbols per card." },
    { name: "Full Deck", order: 7, seconds: 45, goal: 8, tip: "The full deck: eight symbols per card." },
    { name: "Spin Cycle", order: 5, seconds: 40, goal: 8, spin: true, tip: "The cards spin." },
    { name: "Tiny Print", order: 7, seconds: 45, goal: 9, tiny: true, tip: "Some symbols are very small." },
    { name: "Whirlpool", order: 7, seconds: 45, goal: 9, spin: true, tip: "Eight symbols on spinning cards." },
    { name: "Reshuffle", order: 7, seconds: 45, goal: 9, reshuffle: true, tip: "Symbols jump to new spots every few seconds." },
    { name: "Sharp Eyes", order: 7, seconds: 50, goal: 10, penalty: 6, tip: "A wrong tap costs 6 seconds." },
    { name: "Pressure", order: 7, seconds: 30, goal: 9, tip: "Only 30 seconds on the clock." },
    { name: "Chaos", order: 7, seconds: 50, goal: 10, spin: true, tiny: true, tip: "Spinning cards and tiny symbols." },
    { name: "Grandmaster", order: 7, seconds: 50, goal: 11, spin: true, tiny: true, reshuffle: true, penalty: 5, tip: "Everything at once. A wrong tap costs 5 seconds." }
  ];
  for (const L of LEVELS) {
    L.penalty = L.penalty || 3;
    L.stars = [L.goal, Math.ceil(L.goal * 1.35), Math.ceil(L.goal * 1.7)];
  }
  const starsFor = (cfg, score) => cfg.goal ? cfg.stars.filter(s => score >= s).length : 0;

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch { return fallback; } }
  function store(key, v) { try { localStorage.setItem(key, String(v)); } catch {} }

  const progress = (() => {
    let stars = [];
    try { stars = JSON.parse(load("pairo.levelStars", "[]")); } catch {}
    if (!Array.isArray(stars)) stars = [];
    return {
      stars: LEVELS.map((_, i) => Math.max(0, Math.min(3, stars[i] | 0))),
      unlocked(i) { return i === 0 || this.stars[i - 1] > 0; },
      total() { return this.stars.reduce((a, b) => a + b, 0); },
      current() { const i = this.stars.findIndex(s => s === 0); return i < 0 ? LEVELS.length - 1 : i; },
      record(i, s) { if (s > this.stars[i]) { this.stars[i] = s; store("pairo.levelStars", JSON.stringify(this.stars)); return true; } return false; }
    };
  })();

  /** One timed round: Solo Sprint (level -1) or a level. */
  const round = {
    cfg: SPRINT, level: -1, deck: FULL, dealer: new Dealer(FULL), phase: "ready", top: null, hand: null,
    score: 0, best: 0, timeLeft: 60, newBest: false, shakeAt: LONG_AGO,
    countdownAt: LONG_AGO, lastCount: -1, goAt: LONG_AGO, bumpAt: LONG_AGO, leaving: null, lastWarnSec: -1,
    stars: 0, improved: false, overAt: LONG_AGO, starsShown: 0,
    setup(cfg, level) {
      this.cfg = cfg; this.level = level; this.deck = DECKS[cfg.order]; this.dealer = new Dealer(this.deck);
      if (cfg.bestKey) this.best = BESTS[cfg.bestKey] || 0;
      this.phase = "ready"; this.score = 0; this.timeLeft = cfg.seconds; this.leaving = null;
      this.deal();
    },
    deal() {
      const a = this.dealer.draw(), b = this.dealer.draw(a);
      this.top = initRingSpeeds(makeCard(this.deck, a, this.cfg)); this.hand = initRingSpeeds(makeCard(this.deck, b, this.cfg));
    },
    start() {
      this.deal();
      this.score = 0; this.timeLeft = this.cfg.seconds; this.newBest = false; this.leaving = null;
      this.stars = 0; this.improved = false; this.starsShown = 0;
      this.phase = "countdown"; this.countdownAt = now(); this.lastCount = -1; this.lastWarnSec = -1;
    },
    tap(sym) {
      if (this.phase !== "playing") return "ignored";
      if (sym === shared(this.deck, this.top.index, this.hand.index)) {
        this.score++;
        const next = this.dealer.draw(this.top.index, this.hand.index);
        this.leaving = { card: this.top, start: now() };
        this.top = this.hand;
        this.top.born = LONG_AGO;
        this.top.flyAt = now();
        this.hand = initRingSpeeds(makeCard(this.deck, next, this.cfg));
        this.bumpAt = now();
        return "match";
      }
      this.shakeAt = now();
      this.timeLeft -= this.cfg.penalty;
      if (this.timeLeft <= 0) this.finish();
      return "miss";
    },
    tick(dt) {
      if (this.phase !== "playing") return false;
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.finish(); return true; }
      return false;
    },
    finish() {
      this.timeLeft = 0; this.phase = "over"; this.overAt = now(); this.starsShown = 0;
      if (this.level < 0) {
        if (this.score > this.best) {
          this.best = this.score; this.newBest = true;
          BESTS[this.cfg.bestKey] = this.best; store(this.cfg.bestKey, this.best);
        }
      } else {
        this.stars = starsFor(this.cfg, this.score);
        this.improved = progress.record(this.level, this.stars);
      }
    },
    passed() { return this.level >= 0 && this.stars > 0; }
  };

  const duel = {
    dealer: new Dealer(FULL), center: null, hands: [null, null], scores: [0, 0],
    frozenUntil: [LONG_AGO, LONG_AGO], shakeAt: [LONG_AGO, LONG_AGO], winner: -1, leaving: null,
    reset() {
      const c = this.dealer.draw(), p0 = this.dealer.draw(c), p1 = this.dealer.draw(c, p0);
      this.center = makeCard(FULL, c); this.hands = [makeCard(FULL, p0), makeCard(FULL, p1)];
      this.scores = [0, 0]; this.frozenUntil = [LONG_AGO, LONG_AGO]; this.winner = -1; this.leaving = null;
    },
    frozen(p) { return now() < this.frozenUntil[p]; },
    tap(p, sym) {
      if (this.winner >= 0 || this.frozen(p)) return "ignored";
      if (sym === shared(FULL, this.center.index, this.hands[p].index)) {
        this.scores[p]++;
        const next = this.dealer.draw(this.center.index, this.hands[0].index, this.hands[1].index);
        this.leaving = { card: this.center, start: now() };
        this.center = this.hands[p];
        this.center.born = LONG_AGO;
        this.center.flyAt = now();
        this.center.flyFrom = p;
        this.hands[p] = makeCard(FULL, next);
        if (this.scores[p] >= TARGET) this.winner = p;
        return "match";
      }
      this.shakeAt[p] = now();
      this.frozenUntil[p] = now() + FREEZE_MS;
      return "miss";
    }
  };

  for (const cfg of [SPRINT, WHEELS]) BESTS[cfg.bestKey] = parseInt(load(cfg.bestKey, "0"), 10) || 0;
  round.best = BESTS[SPRINT.bestKey];
  round.setup(SPRINT, -1);
  duel.reset();
  let demo = makeCard(FULL, Math.floor(rand() * FULL.cards.length));
  let screen = "menu";

  // ------------------------------------------------------------ Music & sound
  // Music: the original epic theme (taiko, strings, brass, choir), pre-rendered from the same
  // note data as the Android build and played as an ordinary audio file. Media elements are the
  // most reliable way to get sound on phones, and on iPhone they play with the silent switch on.
  // Effects: short chimes synthesised with Web Audio.

    freeze() {
      if (!this.ready()) return;
      this.tone(this.sfxBus, "triangle", 1400, this.ctx.currentTime + 0.005, 0.3, 0.3, 300);
    }
  };

  /** A short note at the bottom of the screen when the browser refuses to play sound. */
  function drawSoundHint(w, h) {
    const k = (now() - sound.hintAt) / 4000;
    if (!sound.blocked || sound.muted || k < 0 || k > 1) return;
    const msg = "No sound? Tap again, and check your volume.";
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - k) * 4);
    const tw = measure(msg, 14, 700) + 32;
    rrect((w - tw) / 2, h - 52, tw, 36, 18, "rgba(51,31,115,.92)");
    text(msg, w / 2, h - 29, 14, 700, "#fff");
    ctx.restore();
  }

  document.addEventListener("visibilitychange", () => {
    lastTick = now();
    sound.syncMusic();
    if (!sound.ctx) return;
    if (document.hidden) sound.ctx.suspend().catch(() => {});
    else sound.ctx.resume().catch(() => {});
  });

  // ------------------------------------------------------------ Symbols: 10 shapes x 6 colours
  const PALETTE = ["#E63946", "#F2A900", "#2A9D50", "#1E78E6", "#8A46C8", "#3A3A4A"];
  const look = s => (s * 13) % SYMBOLS;
  const colorOf = s => PALETTE[Math.floor(look(s) / 10)];

  function darker(hex) {
    const v = parseInt(hex.slice(1), 16);
    const r = Math.floor(((v >> 16) & 255) * 0.7), g = Math.floor(((v >> 8) & 255) * 0.7), b = Math.floor((v & 255) * 0.7);
    return `rgb(${r},${g},${b})`;
  }

  function poly(pts) {
    const p = new Path2D();
    p.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]);
    p.closePath();
    return p;
  }
  function star(points, outer, inner) {
    const pts = [];
    for (let i = 0; i < points * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / points, r = i % 2 === 0 ? outer : inner;
      pts.push(r * Math.cos(a), r * Math.sin(a));
    }
    return poly(pts);
  }
  function circle(r) { const p = new Path2D(); p.arc(0, 0, r, 0, 2 * Math.PI); return p; }
  function crescent() {
    // Big circle (r .45 at origin) minus circle (r .4 at .18,-.15), traced along both arcs.
    const R = 0.45, bx = 0.18, by = -0.15, r = 0.4;
    const d = Math.hypot(bx, by), ux = bx / d, uy = by / d;
    const a = (R * R - r * r + d * d) / (2 * d), h = Math.sqrt(R * R - a * a);
    const px = a * ux, py = a * uy;
    const i1 = [px - h * uy, py + h * ux], i2 = [px + h * uy, py - h * ux];
    const norm = x => ((x % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const passesCw = (s, e, m) => norm(m - s) <= norm(e - s);
    const p = new Path2D();
    p.moveTo(i1[0], i1[1]);
    const t1 = Math.atan2(i1[1], i1[0]), t2 = Math.atan2(i2[1], i2[0]);
    p.arc(0, 0, R, t1, t2, !passesCw(t1, t2, Math.atan2(-uy, -ux)));
    const f2 = Math.atan2(i2[1] - by, i2[0] - bx), f1 = Math.atan2(i1[1] - by, i1[0] - bx);
    p.arc(bx, by, r, f2, f1, !passesCw(f2, f1, Math.atan2(-by, -bx)));
    p.closePath();
    return p;
  }
  function roundSquare(half, rad) {
    const p = new Path2D(), l = -half, t = -half, rr = half, b = half;
    p.moveTo(l + rad, t);
    p.arcTo(rr, t, rr, b, rad); p.arcTo(rr, b, l, b, rad);
    p.arcTo(l, b, l, t, rad); p.arcTo(l, t, rr, t, rad);
    p.closePath();
    return p;
  }

  const SHAPES = (() => {
    const heart = new Path2D();
    heart.moveTo(0, 0.45);
    heart.bezierCurveTo(-0.75, -0.05, -0.35, -0.65, 0, -0.22);
    heart.bezierCurveTo(0.35, -0.65, 0.75, -0.05, 0, 0.45);
    heart.closePath();
    const ring = new Path2D();
    ring.arc(0, 0, 0.45, 0, 2 * Math.PI);
    ring.moveTo(0.22, 0);
    ring.arc(0, 0, 0.22, 0, 2 * Math.PI);
    return [
      { p: circle(0.45) },
      { p: roundSquare(0.4, 0.07) },
      { p: poly([0, -0.5, 0.47, 0.36, -0.47, 0.36]) },
      { p: star(5, 0.52, 0.22) },
      { p: heart },
      { p: poly([0, -0.5, 0.34, 0, 0, 0.5, -0.34, 0]) },
      { p: star(3, 0.47, 0.47) },
      { p: poly([-0.15, -0.45, 0.15, -0.45, 0.15, -0.15, 0.45, -0.15, 0.45, 0.15, 0.15, 0.15,
                 0.15, 0.45, -0.15, 0.45, -0.15, 0.15, -0.45, 0.15, -0.45, -0.15, -0.15, -0.15]) },
      { p: crescent() },
      { p: ring, rule: "evenodd" }
    ];
  })();

  function drawLook(c, lk, cx, cy, size, rot) {
    const shape = SHAPES[lk % 10], col = PALETTE[Math.floor(lk / 10)];
    c.save();
    c.translate(cx, cy);
    c.rotate(rot);
    c.scale(size, size);
    c.fillStyle = col;
    c.fill(shape.p, shape.rule || "nonzero");
    c.strokeStyle = darker(col);
    c.lineWidth = Math.max(1.2, size * 0.045) / size;
    c.lineJoin = "round";
    c.lineCap = "round";
    c.stroke(shape.p);
    c.restore();
  }
  const drawSymbol = (c, s, cx, cy, size, rot) => drawLook(c, look(s), cx, cy, size, rot);

  // ------------------------------------------------------------ Effects: bursts, floating text, confetti, drift
  const fx = [];
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const lerp = (a, b, t) => a + (b - a) * t;

  function burst(x, y, color) {
    fx.push({ kind: "ring", x, y, color, life: 0.45, max: 0.45 });
    const n = REDUCED ? 6 : 14;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, sp = 120 + rand() * 160;
      fx.push({ kind: "dot", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 2.5 + rand() * 3.5,
        color: rand() < 0.35 ? "#fff" : color, life: 0.55, max: 0.55 });
    }
  }
  function floatText(str, x, y, color, flipped) {
    fx.push({ kind: "text", str, x, y, color, flipped, life: 0.8, max: 0.8 });
  }
  function xMark(x, y, flipped) { fx.push({ kind: "x", x, y, flipped, life: 0.45, max: 0.45 }); }
  function confetti(w) {
    if (REDUCED) return;
    for (let i = 0; i < 140; i++) {
      fx.push({ kind: "confetti", x: rand() * w, y: -20 - rand() * 200, vx: (rand() - 0.5) * 90, vy: 60 + rand() * 140,
        rot: rand() * 6, vr: (rand() - 0.5) * 10, w: 6 + rand() * 5, h: 9 + rand() * 6,
        color: rand() < 0.2 ? "#fff" : PALETTE[Math.floor(rand() * 5)], life: 3.2 + rand(), max: 4.2 });
    }
  }

  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const e = fx[i];
      e.life -= dt;
      if (e.life <= 0) { fx.splice(i, 1); continue; }
      if (e.kind === "dot") { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 0.9; e.vy = e.vy * 0.9 + 400 * dt; }
      else if (e.kind === "confetti") {
        e.x += (e.vx + Math.sin(e.life * 3 + e.rot) * 30) * dt; e.y += e.vy * dt; e.rot += e.vr * dt;
      }
    }
  }

  function drawFx() {
    for (const e of fx) {
      const k = e.life / e.max;
      ctx.save();
      if (e.kind === "ring") {
        ctx.globalAlpha = k;
        ctx.strokeStyle = e.color; ctx.lineWidth = 4 * k + 1;
        ctx.beginPath(); ctx.arc(e.x, e.y, 10 + 46 * easeOut(1 - k), 0, Math.PI * 2); ctx.stroke();
      } else if (e.kind === "dot") {
        ctx.globalAlpha = Math.min(1, k * 1.5);
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.4 + 0.6 * k), 0, Math.PI * 2); ctx.fill();
      } else if (e.kind === "text") {
        const t = 1 - k;
        ctx.translate(e.x, e.y);
        if (e.flipped) ctx.rotate(Math.PI);
        ctx.globalAlpha = Math.min(1, k * 2);
        const s = 0.7 + 0.5 * easeOutBack(Math.min(1, t * 4));
        ctx.translate(0, -48 * easeOut(t));
        ctx.scale(s, s);
        ctx.font = `900 26px ${FONT}`; ctx.textAlign = "center";
        ctx.lineWidth = 5; ctx.strokeStyle = "rgba(51,31,115,.55)"; ctx.lineJoin = "round";
        ctx.strokeText(e.str, 0, 0);
        ctx.fillStyle = e.color; ctx.fillText(e.str, 0, 0);
      } else if (e.kind === "x") {
        ctx.translate(e.x, e.y);
        if (e.flipped) ctx.rotate(Math.PI);
        ctx.globalAlpha = k;
        const s = 14 + 10 * (1 - k);
        ctx.strokeStyle = "#E63946"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-s, -s); ctx.lineTo(s, s); ctx.moveTo(s, -s); ctx.lineTo(-s, s); ctx.stroke();
      } else if (e.kind === "confetti") {
        ctx.globalAlpha = Math.min(1, e.life);
        ctx.translate(e.x, e.y); ctx.rotate(e.rot);
        ctx.scale(1, Math.abs(Math.cos(e.rot * 1.7)) * 0.8 + 0.2);
        ctx.fillStyle = e.color; ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
      }
      ctx.restore();
    }
  }

  // Slow-drifting symbols behind the menu.
  const drift = Array.from({ length: REDUCED ? 0 : 16 }, () => ({
    look: Math.floor(rand() * SYMBOLS), x: rand(), y: rand(), vx: (rand() - 0.5) * 14, vy: -6 - rand() * 14,
    rot: rand() * 6, vr: (rand() - 0.5) * 0.6, size: 22 + rand() * 30
  }));
  function drawDrift(w, h, dt) {
    ctx.save();
    ctx.globalAlpha = 0.17;
    for (const s of drift) {
      s.x += s.vx * dt / w; s.y += s.vy * dt / h; s.rot += s.vr * dt;
      if (s.y < -0.08) { s.y = 1.08; s.x = rand(); }
      if (s.x < -0.08) s.x = 1.08; else if (s.x > 1.08) s.x = -0.08;
      drawLook(ctx, s.look, s.x * w, s.y * h, s.size, s.rot);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ Canvas + frame loop
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  }
  window.addEventListener("resize", resize);
  resize();

  let buttons = [], hits = [], lastTick = now();

  const FONT = '"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif';
  function text(s, x, y, size, weight, color, align = "center") {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = "alphabetic";
    ctx.fillText(s, x, y);
  }
  function measure(s, size, weight) { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(s).width; }
  function wrap(s, width, size, weight) {
    const lines = []; let line = "";
    for (const word of s.split(" ")) {
      const trial = line ? line + " " + word : word;
      if (measure(trial, size, weight) > width && line) { lines.push(line); line = word; } else line = trial;
    }
    if (line) lines.push(line);
    return lines;
  }
  function rrect(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }
  function shake(at) { const a = now() - at; if (a < 0 || a > 300) return 0; const t = a / 300; return 12 * Math.sin(t * Math.PI * 4) * (1 - t); }
  const STAR_PATH = star(5, 0.5, 0.21);
  function starIcon(x, y, size, filled, scale = 1) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(size * scale, size * scale);
    ctx.fillStyle = filled ? "#F2B600" : "rgba(255,255,255,.28)";
    ctx.fill(STAR_PATH);
    if (filled) { ctx.strokeStyle = "#B57F00"; ctx.lineWidth = 0.06; ctx.lineJoin = "round"; ctx.stroke(STAR_PATH); }
    ctx.restore();
  }
  function lockIcon(x, y, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = s * 0.14;
    ctx.beginPath(); ctx.arc(0, -s * 0.15, s * 0.28, Math.PI, 0); ctx.stroke();
    ctx.fillRect(-s * 0.4, -s * 0.15, s * 0.8, s * 0.6);
    ctx.restore();
  }

  function frame() {
    const t = now();
    const dt = Math.min(0.1, (t - lastTick) / 1000);
    lastTick = t;
    updateGame(t, dt);
    updateMatch(t);
    updateBattle(t, dt);
    updateArmyDuel(t);
    updateFx(dt);
    sound.setTempo(screen === "solo" && round.phase === "playing" && round.timeLeft <= 10 ? 1.2 : 1);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    buttons = []; hits = [];
    if (screen === "menu" || screen === "rules" || screen === "levels" || screen === "online") drawDrift(W, H, dt);
    if (screen === "menu") drawMenu(W, H, t);
    else if (screen === "levels") drawLevels(W, H, t);
    else if (screen === "rules") drawRules(W, H);
    else if (screen === "solo") drawSolo(W, H, t);
    else if (screen === "online") drawOnline(W, H, t);
    else if (screen === "match") drawMatch(W, H, t);
    else if (screen === "conquest") drawConquest(W, H, t);
    else if (screen === "battle") drawBattle(W, H, t);
    else if (screen === "armyduel") drawArmyDuel(W, H, t);
    else drawDuel(W, H, t);
    drawFx();
    drawSoundHint(W, H);
    requestAnimationFrame(frame);
  }

  function updateGame(t, dt) {
    if (screen !== "solo") return;
    const r = round;
    if (r.phase === "countdown") {
      const e = (t - r.countdownAt) / 1000;
      const n = COUNTDOWN_S - Math.floor(e);
      if (e >= COUNTDOWN_S) {
        r.phase = "playing";
        r.goAt = t;
        r.top.born = t; r.hand.born = t;
        sound.go();
      } else if (n !== r.lastCount) {
        r.lastCount = n;
        sound.tick();
      }
      return;
    }
    if (r.phase === "playing") {
      if (!REDUCED) for (const c of [r.top, r.hand, r.leaving && r.leaving.card]) if (c && c.spin) c.angle += c.spin * dt;
      if (r.cfg.wheels) {
        const k = wheelSpeed(r.score) * (REDUCED ? 0.4 : 1);
        for (const c of [r.top, r.hand, r.leaving && r.leaving.card]) {
          if (c && c.wheel) { c.ringAngle[1] += c.ringSpeed[1] * k * dt; c.ringAngle[2] += c.ringSpeed[2] * k * dt; }
        }
      }
      if (r.cfg.reshuffle) {
        for (const c of [r.top, r.hand]) {
          if (t - c.layoutAt > RESHUFFLE_MS && t - c.flyAt > FLY_MS) {
            c.slots = layout(c.symbols, r.cfg.tiny); c.layoutAt = t; c.born = t;
          }
        }
      }
    }
    if (r.tick(dt)) onRoundOver();
    if (r.phase === "playing") {
      const secs = Math.ceil(r.timeLeft);
      if (secs <= 5 && secs !== r.lastWarnSec) { r.lastWarnSec = secs; sound.tick(); }
    }
    // Results: reveal earned stars one by one.
    if (r.phase === "over" && r.level >= 0 && r.starsShown < r.stars && t - r.overAt > 450 + r.starsShown * 380) {
      r.starsShown++;
      sound.star();
      if (r.starsShown === r.stars && r.stars === 3) confetti(W);
    }
  }

  function onRoundOver() {
    const r = round;
    if (r.level < 0) {
      if (r.newBest) { sound.win(); confetti(W); } else sound.timeup();
    } else if (r.passed()) {
      sound.win();
      if (r.stars < 3) confetti(W);
    } else {
      sound.timeup();
    }
  }

  function openLevel(i) {
    round.setup(LEVELS[i], i);
    screen = "solo";
  }

  // ------------------------------------------------------------ Screens

    text("Find it first.", w / 2, 155, 16, 400, "rgba(255,255,255,.87)");
    const BH = 66, GAP = 76;

    buttons.push({ x: w / 2 - d / 2, y: cy - d / 2, w: d, h: d, run: () => { demo = makeCard(FULL, Math.floor(rand() * FULL.cards.length)); sound.click(); } });

    menuButton(x0, y + 2 * GAP, half, BH, "Sprint",

    menuButton(x0 + half + 12, y + 2 * GAP, half, BH, "Wheels",

  function helpButton(x, y) {
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.beginPath(); ctx.arc(x + 20, y + 20, 20, 0, 2 * Math.PI); ctx.fill();

  function drawLevels(w, h, t) {
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2;
    closeButton(x0, 14, () => { screen = "menu"; });
    text("Levels", w / 2, 44, 26, 900, "#fff");
    const total = `${progress.total()}/${LEVELS.length * 3}`;
    const tw = measure(total, 16, 700);
    starIcon(x0 + cw - tw - 14, 39, 20, true);
    text(total, x0 + cw, 45, 16, 700, "#fff", "right");

    const cols = 3, gap = 12, tileW = (cw - gap * (cols - 1)) / cols;

    const tileH = Math.max(84, Math.min(118, (h - 92 - 16 - gap * (rows - 1)) / rows));
    const cur = progress.current();
    LEVELS.forEach((L, i) => {
      const x = x0 + (i % cols) * (tileW + gap), y = 80 + Math.floor(i / cols) * (tileH + gap);
      const open = progress.unlocked(i), stars = progress.stars[i];
      if (open) {
        rrect(x, y, tileW, tileH, 18, "#fff");
        if (i === cur && stars === 0 && !REDUCED) {
          const pulse = 0.5 + 0.5 * Math.sin(t / 260);
          ctx.save(); ctx.globalAlpha = 0.5 + 0.5 * pulse;
          ctx.strokeStyle = "#F2B600"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 2, y - 2, tileW + 4, tileH + 4, 20) : ctx.rect(x - 2, y - 2, tileW + 4, tileH + 4);
          ctx.stroke(); ctx.restore();
        }
        text(String(i + 1), x + tileW / 2, y + tileH * 0.38, 28, 900, "#331F73");
        const fs = measure(L.name, 12, 700) > tileW - 12 ? 10.5 : 12;
        text(L.name, x + tileW / 2, y + tileH * 0.38 + 20, fs, 700, "rgba(51,31,115,.7)");
        for (let s = 0; s < 3; s++) {
          ctx.save();
          if (s >= stars) { ctx.globalAlpha = 1; }
          starIconDark(x + tileW / 2 + (s - 1) * 22, y + tileH - 18, 18, s < stars);
          ctx.restore();
        }
        buttons.push({ x, y, w: tileW, h: tileH, run: () => { sound.click(); openLevel(i); } });
      } else {
        rrect(x, y, tileW, tileH, 18, "rgba(255,255,255,.16)");
        text(String(i + 1), x + tileW / 2, y + tileH * 0.38, 28, 900, "rgba(255,255,255,.45)");
        lockIcon(x + tileW / 2, y + tileH - 26, 20, "rgba(255,255,255,.55)");
      }
    });
  }
  function starIconDark(x, y, size, filled) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(size, size);
    ctx.fillStyle = filled ? "#F2B600" : "rgba(51,31,115,.14)";
    ctx.fill(STAR_PATH);
    if (filled) { ctx.strokeStyle = "#B57F00"; ctx.lineWidth = 0.06; ctx.lineJoin = "round"; ctx.stroke(STAR_PATH); }
    ctx.restore();
  }

  function drawRules(w, h) {
    const cw = Math.min(w - 32, 460), x0 = (w - cw) / 2;
    rrect(x0, 16, cw, h - 32, 28, "#fff");
    const tx = x0 + 24, tw = cw - 48;
    let y = 60;
    text("How to Play", tx, y, 28, 900, "#331F73", "left");
    y += 8;
    const sections = [
      ["Conquest", "Capture the realm territory by territory, from Highkeep to Dreadspire. Each attack is a battle between two armies: every soldier raises a flag, and you shoot the enemy soldier whose flag matches a symbol on the centre banner before they find yours. Forests spin the symbols, mountains shrink them, swamps shuffle the ranks and castles turn the banner. Your lands earn gold for Scouts, Frost and Rally, and the Ash Legion attacks your border between turns."],
      ["The secret", "Any two cards share exactly one symbol, never more and never less. Symbols vary in size and rotation, so look carefully."],
      ["Levels", "Twelve levels: small decks first, then the full 8-symbol deck, spinning cards, tiny symbols and reshuffles. Reach the goal before time runs out for one star; score more for two or three. Each level unlocks the next."],
      ["Sprint and Wheels", "Tap the symbol both cards share. A wrong tap costs 3 seconds. Score as much as you can in 60 seconds. In Wheels, each card is two rings turning in opposite directions, and they speed up as you score."],
      ["Battle", "Two armies on one phone lying flat between two players. Shoot the other army's soldier whose flag matches a symbol on the centre banner: Player 1 taps the top army, Player 2 the bottom. Wipe out their army of 7 to win."],
      ["Play Online", "Challenge a friend on their own phone. Both of you open this page and tap Play Online. Next to their name, tap Cards for the card game (first to 10) or Armies for a battle (wipe out their army of 7); they tap Accept."],
      ["Duel", "Lay the phone flat between two players. Each finds the symbol shared by their own card and the centre card and taps it on their own card. A wrong tap freezes you for 1.5 seconds. First to 10 wins."]
    ];
    for (const [title, body] of sections) {
      y += 28;
      text(title, tx, y, 17, 700, "#331F73", "left");
      for (const line of wrap(body, tw, 14, 400)) { y += 19; text(line, tx, y, 14, 400, "rgba(51,31,115,.8)", "left"); }
    }
    bigButton(x0 + 24, Math.min(h - 80, y + 26), cw - 48, 50, "Back", true, () => { screen = "menu"; });
  }

  function drawSolo(w, h, t) {
    const r = round, cfg = r.cfg, isLevel = r.level >= 0;
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2;
    const leave = () => { r.phase = "ready"; screen = isLevel ? "levels" : "menu"; };
    closeButton(x0, 14, leave);
    soundButton(x0 + 50, 14);
    const secs = Math.ceil(Math.max(0, r.timeLeft));
    const playing = r.phase === "playing";
    const warn = secs <= 10 && playing;
    const frac = r.timeLeft - Math.floor(r.timeLeft);
    const pulse = warn && !REDUCED ? 1 + 0.16 * Math.max(0, (frac - 0.7) / 0.3) : 1;
    const left = pill(x0 + cw, 17, `Time ${secs}`, warn, pulse);
    const bump = (t - r.bumpAt) / 250;
    const bumpScale = bump >= 0 && bump < 1 ? 1 + 0.25 * (1 - easeOut(bump)) : 1;
    if (isLevel) scorePill(left - 10, 17, r.score, cfg, bumpScale);
    else pill(left - 10, 17, `Score ${r.score}`, false, bumpScale);
    rrect(x0, 66, cw, 8, 4, "rgba(255,255,255,.24)");
    const barFrac = Math.max(0, r.timeLeft) / cfg.seconds;
    if (barFrac > 0) rrect(x0, 66, Math.max(8, cw * barFrac), 8, 4, warn ? "#FFD1D6" : "#fff");

    const d = Math.min(cw * 0.82, (h - 170) / 2);
    const topCy = 88 + d / 2, handCy = 88 + d + 44 + d / 2;
    const hidden = r.phase === "countdown";
    const onTap = playing ? (s, sx, sy) => soloTap(s, sx, sy) : null;
    const rad = c => (c.angle || 0) * Math.PI / 180;

    if (r.leaving) {
      const k = (t - r.leaving.start) / LEAVE_MS;
      if (k >= 1) r.leaving = null;
      else drawCard(r.leaving.card, w / 2, topCy - 60 * easeOut(k), d * (1 - 0.35 * easeOut(k)), { alpha: 1 - k, rot: rad(r.leaving.card) });
    }
    const fly = Math.min(1, (t - r.top.flyAt) / FLY_MS);
    const e = REDUCED ? 1 : easeOut(fly);
    drawCard(r.top, w / 2, lerp(handCy, topCy, e), d, { hidden, rot: rad(r.top), onTap: fly >= 1 ? onTap : null });
    if (!hidden) {
      const hint = isLevel ? `Level ${r.level + 1}: ${cfg.name}`
        : cfg.wheels ? `Wheel speed ×${wheelSpeed(r.score).toFixed(1)}` : "Tap the symbol both cards share";
      text(hint, w / 2, 88 + d + 28, 15, 700, "rgba(255,255,255,.87)");
    }
    drawCard(r.hand, w / 2, handCy, d, { shakeX: shake(r.shakeAt), hidden, rot: rad(r.hand), onTap });

    if (hidden) {
      const el = (t - r.countdownAt) / 1000, n = COUNTDOWN_S - Math.floor(el), k = el - Math.floor(el);
      bigNumber(String(n), w / 2, (topCy + handCy) / 2, k);
    } else if (t - r.goAt < 500) {
      bigNumber("Go!", w / 2, (topCy + handCy) / 2, (t - r.goAt) / 500);
    }

    if (r.phase === "ready") {
      if (isLevel) {
        panel(w, h, {
          title: `Level ${r.level + 1}`, subtitle: cfg.name,
          body: `Get ${cfg.goal} matches in ${cfg.seconds} seconds. ${cfg.tip}`,
          goals: cfg.stars,
          primary: { label: "Start", run: () => r.start() },
          links: [{ label: "Levels", run: () => { screen = "levels"; } }]
        });
      } else {
        panel(w, h, {
          title: cfg.name,
          body: cfg.wheels
            ? "Each card is two wheels turning in opposite directions. Tap the symbol both cards share before it spins away. The wheels speed up with every match. A wrong tap costs 3 seconds."
            : "Tap the one symbol that appears on both cards. Every match scores a point. A wrong tap costs 3 seconds.",
          primary: { label: "Start", run: () => r.start() },
          links: [{ label: "Menu", run: () => { screen = "menu"; } }]
        });
      }
    } else if (r.phase === "over") {
      if (!isLevel) {
        panel(w, h, {
          title: r.newBest ? "New best!" : "Time's up!", big: String(r.score), body: `Best: ${r.best}`,
          primary: { label: "Play again", run: () => r.start() },
          links: [{ label: "Menu", run: () => { screen = "menu"; } }]
        });
      } else {
        const next = r.level + 1 < LEVELS.length && progress.unlocked(r.level + 1) ? r.level + 1 : -1;
        const passed = r.passed();
        const nextGoal = r.stars < 3 ? cfg.stars[r.stars] : 0;
        panel(w, h, {
          title: passed ? (r.level === LEVELS.length - 1 && r.stars === 3 ? "Grandmaster!" : "Level complete!") : "Not quite",
          subtitle: `Level ${r.level + 1}: ${cfg.name}`,
          stars: { earned: r.stars, shown: r.starsShown, at: r.overAt },
          body: passed
            ? `${r.score} matches.` + (nextGoal ? ` ${nextGoal} for the next star.` : " All three stars!")
            : `${r.score} of ${cfg.goal} matches. Try again!`,
          primary: passed && next >= 0
            ? { label: "Next level", run: () => openLevel(next) }
            : { label: "Try again", run: () => r.start() },
          links: passed && next >= 0
            ? [{ label: "Retry", run: () => r.start() }, { label: "Levels", run: () => { screen = "levels"; } }]
            : [{ label: "Levels", run: () => { screen = "levels"; } }]
        });
      }
    }
  }

  function bigNumber(s, x, y, k) {
    ctx.save();
    ctx.translate(x, y);
    const sc = REDUCED ? 1 : 1.5 - 0.5 * easeOut(Math.min(1, k * 2.5));
    ctx.scale(sc, sc);
    ctx.globalAlpha = 1 - Math.max(0, k - 0.6) / 0.4 * 0.85;
    ctx.font = `900 96px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 10; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(51,31,115,.6)";
    ctx.strokeText(s, 0, 4);
    ctx.fillStyle = "#fff"; ctx.fillText(s, 0, 4);
    ctx.restore();
  }

  function drawDuel(w, h, t) {
    const cw = Math.min(w - 32, 488);
    const handD = Math.min(cw * 0.7, (h - 100) * 0.36);
    const centerD = Math.min(cw * 0.45, (h - 100) * 0.22);
    const live = duel.winner < 0;
    const spots = [
      { cx: w / 2, cy: h - 46 - handD / 2, d: handD, rot: 0 },
      { cx: w / 2, cy: 46 + handD / 2, d: handD, rot: Math.PI }
    ];

    playerLabel(1, w / 2, 22, true);
    playerLabel(0, w / 2, h - 22, false);
    for (const p of [1, 0]) {
      const s = spots[p];
      drawCard(duel.hands[p], s.cx, s.cy, s.d, {
        shakeX: (p ? -1 : 1) * shake(duel.shakeAt[p]), rot: s.rot, frozen: duel.frozen(p),
        onTap: live ? (sym, sx, sy) => duelTap(p, sym, sx, sy) : null
      });
    }

    if (duel.leaving) {
      const k = (t - duel.leaving.start) / LEAVE_MS;
      if (k >= 1) duel.leaving = null;
      else drawCard(duel.leaving.card, w / 2, h / 2, centerD * (1 - 0.6 * easeOut(k)), { alpha: 1 - k });
    }
    const c = duel.center, fly = Math.min(1, (t - c.flyAt) / FLY_MS);
    if (fly < 1 && c.flyFrom >= 0 && !REDUCED) {
      const from = spots[c.flyFrom], e = easeOut(fly);
      drawCard(c, lerp(from.cx, w / 2, e), lerp(from.cy, h / 2, e), lerp(from.d, centerD, e), { rot: lerp(from.rot, 0, e) });
    } else {
      drawCard(c, w / 2, h / 2, centerD, {});
    }

    closeButton(16, h / 2 - 20, () => { screen = "menu"; });
    soundButton(w - 56, h / 2 - 20);

    if (duel.winner >= 0) {
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(0, 0, w, h);
      const title = `Player ${duel.winner + 1} wins!`, score = `${duel.scores[0]} – ${duel.scores[1]}`;
      const bw = Math.min(cw, 320);
      ctx.save();
      ctx.translate(w / 2, h * 0.2); ctx.rotate(Math.PI); ctx.translate(-w / 2, -h * 0.2);
      winBanner(title, score, w / 2, h * 0.2, bw);
      ctx.restore();
      winBanner(title, score, w / 2, h * 0.8, bw);
      rrect((w - bw) / 2, h / 2 - 66, bw, 132, 28, "rgba(51,31,115,.92)");
      bigButton((w - bw) / 2 + 24, h / 2 - 46, bw - 48, 52, "Rematch", false, () => duel.reset());
      text("Menu", w / 2, h / 2 + 40, 17, 700, "#fff");
      buttons.push({ x: w / 2 - 60, y: h / 2 + 14, w: 120, h: 46, run: () => { screen = "menu"; } });
    }
  }

  // ------------------------------------------------------------ Pieces
  /** rot (radians) turns the whole card; hit-testing follows the same rotation. */
  function drawCard(card, cx, cy, d, o) {
    const { shakeX = 0, rot = 0, frozen = false, onTap = null, alpha = 1, hidden = false } = o;
    const t = Math.min(1, Math.max(0, (now() - card.born) / 280));
    const scale = REDUCED ? 1 : 0.6 + 0.4 * easeOutBack(t);
    const r = d / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx + shakeX, cy);
    ctx.fillStyle = "rgba(40,26,90,.27)";
    ctx.beginPath(); ctx.arc(d * 0.012 * scale, d * 0.03 * scale, r * scale, 0, 2 * Math.PI); ctx.fill();
    ctx.scale(scale, scale);
    ctx.rotate(rot);
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.fill();
    const bw = Math.max(2, d * 0.012);
    ctx.strokeStyle = "rgba(51,31,115,.12)"; ctx.lineWidth = bw;
    ctx.beginPath(); ctx.arc(0, 0, r - bw / 2, 0, 2 * Math.PI); ctx.stroke();
    if (hidden) {
      ctx.rotate(-rot);
      ctx.fillStyle = "rgba(51,31,115,.14)";
      ctx.font = `900 ${Math.round(d * 0.4)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("?", 0, d * 0.02);
    } else {
      if (card.wheel) drawWheelTracks(card, d);
      for (const s of card.slots) {
        const [x, y] = slotXY(card, s);
        const turn = card.wheel && s.ring ? card.ringAngle[s.ring] * Math.PI / 180 : 0;
        drawSymbol(ctx, s.symbol, x * d, y * d, s.size * d, s.rot + turn);
      }
    }
    if (frozen) {
      ctx.fillStyle = "rgba(255,255,255,.67)";
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.fill();
      snowflake(d * 0.32);
    }
    ctx.restore();
    if (onTap) hits.push({ card, cx: cx + shakeX, cy, d, rot, onTap });
  }

  /** Two faint tracks, each with tick marks that turn with its ring, so the motion reads at a glance. */
  function drawWheelTracks(card, d) {
    ctx.save();
    for (const ring of [1, 2]) {
      const r = WHEEL_R[ring] * d;
      ctx.strokeStyle = ring === 1 ? "rgba(87,56,219,.16)" : "rgba(240,87,140,.18)";
      ctx.lineWidth = Math.max(2, d * 0.09);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.stroke();
      ctx.strokeStyle = ring === 1 ? "rgba(87,56,219,.35)" : "rgba(240,87,140,.4)";
      ctx.lineWidth = Math.max(1.5, d * 0.008);
      ctx.lineCap = "round";
      const a0 = card.ringAngle[ring] * Math.PI / 180, ticks = ring === 1 ? 12 : 20;
      ctx.beginPath();
      for (let i = 0; i < ticks; i++) {
        const a = a0 + (i + 0.5) * 2 * Math.PI / ticks, c = Math.cos(a), n = Math.sin(a);
        ctx.moveTo(c * (r - d * 0.03), n * (r - d * 0.03));
        ctx.lineTo(c * (r + d * 0.03), n * (r + d * 0.03));
      }
      ctx.stroke();
    }
    // Hub.
    ctx.fillStyle = "rgba(51,31,115,.18)";
    ctx.beginPath(); ctx.arc(0, 0, d * 0.035, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
  }

  function snowflake(size) {
    ctx.strokeStyle = "#1E78E6"; ctx.lineWidth = size * 0.08; ctx.lineCap = "round";
    const r = size / 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, ex = r * Math.cos(a), ey = r * Math.sin(a);
      ctx.moveTo(0, 0); ctx.lineTo(ex, ey);
      const bx = 0.6 * ex, by = 0.6 * ey, br = r * 0.3;
      ctx.moveTo(bx, by); ctx.lineTo(bx + br * Math.cos(a + 0.7), by + br * Math.sin(a + 0.7));
      ctx.moveTo(bx, by); ctx.lineTo(bx + br * Math.cos(a - 0.7), by + br * Math.sin(a - 0.7));
    }
    ctx.stroke();
  }

  function playerLabel(p, cx, cy, flipped) {
    const label = `Player ${p + 1}`, lw = measure(label, 17, 700);
    const total = lw + 14 + TARGET * 13 - 4;
    let x = cx - total / 2;
    ctx.save();
    if (flipped) { ctx.translate(cx, cy); ctx.rotate(Math.PI); ctx.translate(-cx, -cy); }
    text(label, x, cy + 6, 17, 700, "#fff", "left");
    x += lw + 14;
    for (let i = 0; i < TARGET; i++) {
      ctx.fillStyle = i < duel.scores[p] ? "#fff" : "rgba(255,255,255,.27)";
      ctx.beginPath(); ctx.arc(x + i * 13 + 4.5, cy, 4.5, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.restore();
  }

  function winBanner(title, score, cx, cy, bw) {
    rrect(cx - bw / 2, cy - 52, bw, 104, 28, "rgba(51,31,115,.92)");
    text(title, cx, cy - 2, 32, 900, "#fff");
    text(score, cx, cy + 32, 22, 700, "rgba(255,255,255,.87)");
  }

  /**
   * The dialog used before and after a round.
   * o: { title, subtitle?, big?, stars?: {earned, shown, at}, goals?: [n1,n2,n3], body?, primary: {label, run}, links: [{label, run}] }
   */
  function panel(w, h, o) {
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(0, 0, w, h);
    const pw = Math.min(w - 32, 360), tw = pw - 56;
    const lines = o.body ? wrap(o.body, tw, 16, 400) : [];
    const ph = 28 + 36 + (o.subtitle ? 26 : 0) + (o.big ? 92 : 0) + (o.stars ? 78 : 0) + (o.goals ? 44 : 0)
      + lines.length * 22 + 24 + 52 + 44 + 16;
    const px = (w - pw) / 2, py = Math.max(8, (h - ph) / 2);
    rrect(px, py, pw, ph, 28, "rgba(51,31,115,.94)");
    let y = py + 56;
    text(o.title, w / 2, y, 30, 900, "#fff");
    if (o.subtitle) { y += 26; text(o.subtitle, w / 2, y, 16, 700, "rgba(255,255,255,.75)"); }
    if (o.big) { text(o.big, w / 2, y + 88, 80, 900, "#fff"); y += 92; }
    if (o.stars) {
      const t = now();
      for (let i = 0; i < 3; i++) {
        const on = i < o.stars.shown;
        let sc = 1;
        if (on && !REDUCED) {
          const k = (t - (o.stars.at + 450 + i * 380)) / 300;
          sc = k < 0 ? 0 : k < 1 ? easeOutBack(k) : 1;
        }
        const sx = w / 2 + (i - 1) * 62, sy = y + 46 - (i === 1 ? 8 : 0);
        starIcon(sx, sy, 50, false);
        if (on) starIcon(sx, sy, 50, true, sc);
      }
      y += 78;
    }
    if (o.goals) {
      y += 30;
      const gw = 92, gx = w / 2 - gw;
      o.goals.forEach((g, i) => {
        const cx = gx + i * gw;
        for (let s = 0; s <= i; s++) starIcon(cx - (i * 8) + s * 16, y - 6, 14, true);
        text(String(g), cx, y + 14, 14, 700, "rgba(255,255,255,.85)");
      });
      y += 14;
    }
    for (const l of lines) { y += 22; text(l, w / 2, y, 16, 400, "rgba(255,255,255,.88)"); }
    y += 24;
    bigButton(px + 28, y, pw - 56, 52, o.primary.label, false, o.primary.run);
    const links = o.links || [];
    links.forEach((L, i) => {
      const lx = w / 2 + (i - (links.length - 1) / 2) * 110;
      text(L.label, lx, y + 82, 16, 700, "#fff");
      buttons.push({ x: lx - 52, y: y + 58, w: 104, h: 40, run: () => { round.phase = "ready"; L.run(); } });
    });
  }

  function menuButton(x, y, w, h, title, sub, iconLook, run, isNew) {
    rrect(x, y, w, h, 22, "#fff");
    ctx.fillStyle = "rgba(51,31,115,.1)";
    ctx.beginPath(); ctx.arc(x + 38, y + h / 2, 24, 0, 2 * Math.PI); ctx.fill();
    drawLook(ctx, iconLook, x + 38, y + h / 2, 30, 0);
    text(title, x + 78, y + h / 2 - 3, 20, 700, "#331F73", "left");
    // Narrow (half-width) buttons drop the arrow to make room for the subtitle.
    const narrow = w < 250;
    let s = sub;
    while (s.length > 4 && measure(s, 14, 400) > w - 78 - (narrow ? 10 : 40)) s = s.slice(0, -2) + "…";
    text(s, x + 78, y + h / 2 + 19, 14, 400, "rgba(51,31,115,.69)", "left");
    if (!narrow) {
      ctx.strokeStyle = "rgba(51,31,115,.47)"; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
      const ax = x + w - 26, ay = y + h / 2;
      ctx.beginPath(); ctx.moveTo(ax - 5, ay - 7); ctx.lineTo(ax + 2, ay); ctx.lineTo(ax - 5, ay + 7); ctx.stroke();
    }
    if (isNew) {
      const bw = measure("NEW", 11, 900) + 14;
      rrect(x + w - bw - 10, y - 8, bw, 20, 10, "#F2B600");
      text("NEW", x + w - bw / 2 - 10, y + 6, 11, 900, "#331F73");
    }
    buttons.push({ x, y, w, h, run });
  }

  function bigButton(x, y, w, h, label, inverted, run) {
    rrect(x, y, w, h, 18, inverted ? "#331F73" : "#fff");
    text(label, x + w / 2, y + h / 2 + 7, 19, 700, inverted ? "#fff" : "#331F73");
    buttons.push({ x, y, w, h, run });
  }

  function pill(right, y, label, warn, scale = 1) {
    const pw = measure(label, 16, 700) + 28;
    ctx.save();
    ctx.translate(right - pw / 2, y + 17); ctx.scale(scale, scale); ctx.translate(-(right - pw / 2), -(y + 17));
    rrect(right - pw, y, pw, 34, 17, warn ? "rgba(230,57,70,.82)" : "rgba(255,255,255,.2)");
    text(label, right - pw / 2, y + 23, 16, 700, "#fff");
    ctx.restore();
    return right - pw;
  }

  /** Level score: "6/8" plus three small stars that light up as thresholds are reached. */
  function scorePill(right, y, score, cfg, scale) {
    const label = `${score}/${cfg.goal}`;
    const lw = measure(label, 16, 700), pw = lw + 28 + 3 * 15 + 4;
    ctx.save();
    ctx.translate(right - pw / 2, y + 17); ctx.scale(scale, scale); ctx.translate(-(right - pw / 2), -(y + 17));
    rrect(right - pw, y, pw, 34, 17, "rgba(255,255,255,.2)");
    text(label, right - pw + 14, y + 23, 16, 700, "#fff", "left");
    for (let i = 0; i < 3; i++) starIcon(right - pw + 14 + lw + 12 + i * 15, y + 17, 14, score >= cfg.stars[i]);
    ctx.restore();
    return right - pw;
  }

  function closeButton(x, y, run) {
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.beginPath(); ctx.arc(x + 20, y + 20, 20, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x + 14, y + 14); ctx.lineTo(x + 26, y + 26);
    ctx.moveTo(x + 26, y + 14); ctx.lineTo(x + 14, y + 26); ctx.stroke();
    buttons.push({ x: x - 4, y: y - 4, w: 48, h: 48, run });
  }

  function soundButton(x, y) {
    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.beginPath(); ctx.arc(x + 20, y + 20, 20, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 16); ctx.lineTo(x + 15, y + 16); ctx.lineTo(x + 21, y + 11);
    ctx.lineTo(x + 21, y + 29); ctx.lineTo(x + 15, y + 24); ctx.lineTo(x + 10, y + 24); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    ctx.beginPath();
    if (sound.muted) {
      ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 31, y + 24); ctx.moveTo(x + 31, y + 16); ctx.lineTo(x + 24, y + 24);
    } else {
      ctx.arc(x + 21, y + 20, 5, -0.9, 0.9);
      ctx.moveTo(x + 21 + 9 * Math.cos(-0.9), y + 20 + 9 * Math.sin(-0.9));
      ctx.arc(x + 21, y + 20, 9, -0.9, 0.9);
    }
    ctx.stroke();
    buttons.push({ x: x - 4, y: y - 4, w: 48, h: 48, run: () => sound.setMuted(!sound.muted) });
  }

  // ------------------------------------------------------------ Online play
  // Everyone with this page open shares a lobby. A player on the Online screen says so in
  // their presence, plus whom they have challenged; the other side accepts in their presence.
  // The match runs in a private named room. The challenger hosts and referees: its presence
  // carries the whole game state, and the guest's presence carries its latest claimed match.
  // Presence is used for everything because anyone with access may set it (no edit rights needed).
  const GAME_NAME = /^[a-z0-9][a-z0-9_.-]{0,47}$/;
  const HOST_DELAY_MS = 90;
  const net = {
    status: "idle",            // idle | connecting | online | unavailable
    room: null, user: null, me: "", peers: [], names: {}, colors: {},
    challenge: null,           // {to: peer, game} that I sent
    match: null
  };
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

  function nameOf(by, fallback) { return (by && net.names[by]) || fallback; }

  function resolveNames(peers) {
    if (!net.user) return;
    const ids = [...new Set(peers.map(p => p.by).filter(Boolean))];
    if (!ids.length) return;
    net.user.profiles(ids).then(ps => {
      for (const id of ids) { if (ps[id]) { net.names[id] = ps[id].name; net.colors[id] = ps[id].color; } }
    }).catch(() => {});
  }

  async function netStart() {
    if (net.status !== "idle") return;
    net.status = "connecting";
    const giveUp = setTimeout(() => { if (net.status === "connecting") net.status = "unavailable"; }, 12000);
    let room = null;
    try { room = window.claude && window.claude.use ? await window.claude.use("room") : null; } catch { room = null; }
    if (!room) { clearTimeout(giveUp); net.status = "unavailable"; return; }
    try { net.user = await window.claude.use("user"); } catch { net.user = null; }
    net.room = room;
    room.onPeers(ch => {
      net.peers = ch.peers;
      const mine = ch.peers.find(p => p.sameTab);
      if (mine) net.me = mine.peer;
      resolveNames(ch.peers);
      checkAccepted();
    }, () => { net.status = "unavailable"; });
    clearTimeout(giveUp);
    net.status = "online";
    lobbyPresence();
  }

  function lobbyPresence() {
    if (!net.room) return;
    net.room.presence({
      mode: net.match ? "playing" : screen === "online" ? "lobby" : null,
      challenge: net.challenge,
      accept: net.match && net.match.role === "guest" ? { to: net.match.opp, game: net.match.game } : null
    }).catch(() => {});
  }

  function openOnline() { screen = "online"; netStart(); lobbyPresence(); }
  function closeOnline() { net.challenge = null; screen = "menu"; lobbyPresence(); }

  /** Other people in the lobby (not me, not my other tabs, not Claude). */
  function lobbyOthers() {
    return net.peers.filter(p => !p.isMe && p.kind === "viewer");
  }

  function challenge(p, mode) {
    net.challenge = { to: p.peer, game: "g-" + Math.random().toString(36).slice(2, 10), mode };
    sound.click();
    lobbyPresence();
  }
  function cancelChallenge() { net.challenge = null; lobbyPresence(); }

  function accept(p) {
    const c = p.presence && p.presence.challenge;
    if (!c || c.to !== net.me || typeof c.game !== "string" || !GAME_NAME.test(c.game)) return;
    sound.click();
    startMatch(c.game, "guest", p.peer, p.by, c.mode === "army" ? "army" : "cards");
  }

  /** As challenger: start once the person I challenged has accepted. */
  function checkAccepted() {
    if (!net.challenge || net.match) return;
    const p = net.peers.find(q => q.peer === net.challenge.to);
    const a = p && p.presence && p.presence.accept;
    if (a && a.to === net.me && a.game === net.challenge.game) {
      const game = net.challenge.game, mode = net.challenge.mode === "army" ? "army" : "cards";
      net.challenge = null;
      startMatch(game, "host", p.peer, p.by, mode);
    }
  }

  async function startMatch(game, role, opp, oppBy, mode) {
    const m = net.match = {
      game, role, opp, oppBy, mode, r: null, oppHere: false, oppLeft: false, failed: false,
      volley: null, armyKey: "", army: null, raiseAt: LONG_AGO,
      state: null, prev: null, dealer: role === "host" ? new Dealer(FULL) : null,
      lastK: 0, myK: 0, cards: {}, seenPhaseAt: now(), lastCount: -1,
      frozenUntil: LONG_AGO, shakeAt: LONG_AGO, unsub: null
    };
    screen = "match";
    lobbyPresence();
    let r;
    try { r = await net.room.join(game); } catch { m.failed = true; return; }
    if (net.match !== m) { r.leave().catch(() => {}); return; }
    m.r = r;
    m.unsub = r.onPeers(ch => onMatchPeers(m, ch), () => { m.failed = true; });
    if (role === "host") {
      m.state = { phase: "waiting", mode, round: 0, c: 0, h: [0, 0], s: [0, 0], w: -1, n: 0, by: -1 };
      publish(m);
    } else {
      r.presence({ role: "guest", tap: null }).catch(() => {});
    }
  }

  function leaveMatch() {
    const m = net.match;
    net.match = null;
    if (m) {
      if (m.unsub) m.unsub();
      if (m.r) m.r.leave().catch(() => {});
    }
    screen = "online";
    lobbyPresence();
  }

  function onMatchPeers(m, ch) {
    if (net.match !== m) return;
    const opp = ch.peers.find(p => p.peer === m.opp);
    if (opp) { m.oppHere = true; m.oppLeft = false; }
    if (ch.left.some(p => p.peer === m.opp)) m.oppLeft = true;
    if (!opp) return;
    const pr = opp.presence || {};
    if (m.role === "host") {
      const tap = pr.tap;
      if (tap && isInt(tap.k, 1, 1e9) && tap.k > m.lastK) {
        m.lastK = tap.k;
        if (isInt(tap.c, 0, 56) && isInt(tap.h, 0, 56) && isInt(tap.sym, 0, 56)) {
          if (m.mode === "army") hostClaimArmy(m, 1, tap.c, tap.h, tap.sym); else hostClaim(m, 1, tap.c, tap.h, tap.sym);
        }
      }
    } else if (pr.role === "host" && pr.g) {
      applyState(m, pr.g);
    }
  }

  // ---- host (referee)
  function publish(m) {
    if (m.r) m.r.presence({ role: "host", g: m.state }).catch(() => {});
    applyState(m, m.state);
  }

  function hostStart(m) {
    const d = m.dealer, c = d.draw(), a = d.draw(c), b = d.draw(c, a);
    m.state = { phase: "countdown", mode: m.mode, round: m.state.round + 1, c, h: [a, b], s: [0, 0], w: -1, n: 0, by: -1 };
    publish(m);
    const round = m.state.round;
    setTimeout(() => {
      if (net.match === m && m.state.phase === "countdown" && m.state.round === round) {
        m.state = { ...m.state, phase: "playing" };
        publish(m);
      }
    }, COUNTDOWN_S * 1000);
  }

  /** The referee's decision on a claimed match by player p (0 = host, 1 = guest). */
  function hostClaim(m, p, c, h, sym) {
    const g = m.state;
    if (g.phase !== "playing" || c !== g.c || h !== g.h[p]) return; // stale: the centre already changed
    if (sym !== shared(FULL, c, h)) return;
    const next = m.dealer.draw(g.c, g.h[0], g.h[1]);
    const hands = g.h.slice(), scores = g.s.slice();
    hands[p] = next;
    scores[p]++;
    const over = scores[p] >= TARGET;
    m.state = { ...g, c: h, h: hands, s: scores, n: g.n + 1, by: p, phase: over ? "over" : "playing", w: over ? p : -1 };
    publish(m);
  }

  /**
   * Army rules: player p shoots the other army's soldier whose flag (a symbol of card `target`)
   * matches the banner (card c). Then everyone raises new flags under a new banner.
   */
  function hostClaimArmy(m, p, c, target, sym) {
    const g = m.state;
    if (g.phase !== "playing" || c !== g.c || target !== g.h[1 - p]) return; // stale: a new round began
    if (sym !== shared(FULL, c, target)) return;
    const d = m.dealer, nc = d.draw(g.c, g.h[0], g.h[1]), na = d.draw(nc), nb = d.draw(nc, na);
    const scores = g.s.slice();
    scores[p]++;
    const over = scores[p] >= ARMY_TARGET;
    m.state = { ...g, c: nc, h: [na, nb], s: scores, n: g.n + 1, by: p, phase: over ? "over" : "playing", w: over ? p : -1 };
    publish(m);
  }

  // ---- both sides: show the state
  function validState(g) {
    return g && typeof g === "object" && ["waiting", "countdown", "playing", "over"].includes(g.phase)
      && isInt(g.c, 0, 56) && Array.isArray(g.h) && isInt(g.h[0], 0, 56) && isInt(g.h[1], 0, 56)
      && Array.isArray(g.s) && isInt(g.s[0], 0, TARGET) && isInt(g.s[1], 0, TARGET)
      && (g.mode === undefined || g.mode === "cards" || g.mode === "army")
      && isInt(g.n, 0, 1e6) && isInt(g.round, 0, 1e6) && isInt(g.w, -1, 1) && isInt(g.by, -1, 1);
  }

  function cardFor(m, idx) {
    if (!m.cards[idx]) m.cards[idx] = makeCard(FULL, idx);
    return m.cards[idx];
  }

  function applyState(m, g) {
    if (!validState(g)) return;
    const prev = m.prev;
    const me = m.role === "host" ? 0 : 1;
    if (m.role === "guest") m.state = g;
    const t = now();
    if (!prev || prev.round !== g.round) {
      m.cards = {};
      m.seenPhaseAt = t; m.lastCount = -1;
    }
    if (prev && prev.phase !== g.phase) {
      m.seenPhaseAt = t; m.lastCount = -1;
      if (g.phase === "playing") {
        sound.go();
        cardFor(m, g.c).born = t; cardFor(m, g.h[me]).born = t;
      }
      if (g.phase === "over") {
        if (g.w === me) { sound.win(); confetti(W); } else sound.timeup();
      }
    }
    if (m.mode === "army") {
      if (prev && prev.round === g.round && g.n > prev.n) {
        // The scorer shot the other army's soldier whose flag matched the old banner.
        const victim = 1 - g.by;
        m.volley = { by: g.by, victimPlayer: victim, sym: shared(FULL, prev.c, prev.h[victim]), at: t, view: prev,
          label: g.by === me ? "Hit!" : "" };
        if (g.by !== me) { sound.oppScore(); haptic(8); }
      }
      if (prev && prev.phase !== g.phase && g.phase === "playing") m.raiseAt = t;
      m.prev = g;
      return;
    }
    if (prev && prev.round === g.round && g.n > prev.n) {
      // Someone scored: the scorer's card became the centre.
      const center = cardFor(m, g.c);
      center.born = LONG_AGO; center.flyAt = t; center.flyFrom = g.by === me ? 0 : 1;
      if (g.by === me) {
        cardFor(m, g.h[me]);
        m.cards[g.h[me]].born = t;
        floatText("+1", W / 2, m.centerY || H * 0.3, "#fff", false);
      } else {
        sound.oppScore();
        haptic(8);
      }
      m.bumpAt = t;
    }
    // Keep only the cards on the table.
    const keep = new Set([g.c, g.h[me]]);
    for (const k of Object.keys(m.cards)) if (!keep.has(+k)) delete m.cards[k];
    cardFor(m, g.c); cardFor(m, g.h[me]);
    m.prev = g;
  }

  function matchTap(sym, sx, sy) {
    const m = net.match, g = m && m.state;
    if (!g || g.phase !== "playing" || now() < m.frozenUntil) return;
    const me = m.role === "host" ? 0 : 1;
    if (sym === shared(FULL, g.c, g.h[me])) {
      sound.match(); haptic(15);
      burst(sx, sy, colorOf(sym));
      // The referee's own taps wait about one network hop, so the friend's taps aren't
      // at a disadvantage in near-ties.
      if (m.role === "host") { const c = g.c, hh = g.h[0]; setTimeout(() => { if (net.match === m) hostClaim(m, 0, c, hh, sym); }, HOST_DELAY_MS); }
      else {
        m.myK++;
        m.r.presence({ role: "guest", tap: { k: m.myK, c: g.c, h: g.h[1], sym } }).catch(() => {});
      }
    } else {
      sound.freeze(); haptic([30, 40, 30]);
      xMark(sx, sy, false);
      m.frozenUntil = now() + FREEZE_MS;
      m.shakeAt = now();
    }
  }

  function armyTap(i, x, y) {
    const m = net.match, g = m && m.state, v = m && m.army;
    if (!g || !v || g.phase !== "playing" || m.volley || now() < m.frozenUntil) return;
    const me = m.role === "host" ? 0 : 1, them = 1 - me, sym = v.flags[1][i];
    if (sym === shared(FULL, g.c, g.h[them])) {
      sound.match(); haptic(15);
      if (m.role === "host") { const c = g.c, target = g.h[1]; setTimeout(() => { if (net.match === m) hostClaimArmy(m, 0, c, target, sym); }, HOST_DELAY_MS); }
      else {
        m.myK++;
        m.r.presence({ role: "guest", tap: { k: m.myK, c: g.c, h: g.h[0], sym } }).catch(() => {});
      }
    } else {
      sound.freeze(); haptic([30, 40, 30]);
      xMark(x, y, false);
      m.frozenUntil = now() + FREEZE_MS;
      m.shakeAt = now();
    }
  }

  /** The army view of a match: your army at the bottom, your friend's at the top. */
  function drawOnlineArmies(m, w, h, t) {
    const me = m.role === "host" ? 0 : 1, them = 1 - me;
    if (m.volley && t - m.volley.at >= VOLLEY_MS) { m.volley = null; m.raiseAt = t; }
    const view = m.volley ? m.volley.view : m.state;
    const key = `${view.round}:${view.n}`;
    if (m.armyKey !== key) {
      m.armyKey = key;
      m.army = {
        banner: shuffle([...FULL.cards[view.c]]),
        flags: [shuffle([...FULL.cards[view.h[me]]]), shuffle([...FULL.cards[view.h[them]]])]
      };
    }
    const v = m.army, L = armyLayout(w, h, 8, 100, h - 40, 0);
    drawField(w, h, L);
    const hidden = view.phase === "countdown";
    const playing = m.state.phase === "playing" && !m.volley;
    let volley = null;
    if (m.volley) {
      const side = m.volley.victimPlayer === me ? 0 : 1;
      volley = m.volley;
      volley.side = side;
      volley.idx = v.flags[side].indexOf(m.volley.sym);
    }
    drawArmies(L, t, {
      flags: v.flags, rise: hidden ? 0 : clamp01((t - m.raiseAt) / RAISE_MS),
      frozen: [t < m.frozenUntil, false], volley, shake: [shake(m.shakeAt), 0],
      onTap: [null, playing && t >= m.frozenUntil ? (i, x, y) => armyTap(i, x, y) : null]
    });
    drawBanner(w, L, t, hidden, v.banner, null, false);
    drawVolley(w, L, t, volley);
    return L;
  }

  function updateMatch(t) {
    const m = net.match;
    if (!m || !m.state || m.state.phase !== "countdown") return;
    const n = COUNTDOWN_S - Math.floor((t - m.seenPhaseAt) / 1000);
    if (n >= 1 && n !== m.lastCount) { m.lastCount = n; sound.tick(); }
  }

  // ---- screens
  function drawOnline(w, h, t) {
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2;
    closeButton(x0, 14, closeOnline);
    text("Play Online", w / 2, 44, 26, 900, "#fff");
    let y = 86;
    const card = (hh) => { rrect(x0, y, cw, hh, 22, "#fff"); };
    const para = (s, size, color, top) => {
      let yy = top;
      for (const line of wrap(s, cw - 40, size, 400)) { yy += size + 6; text(line, x0 + 20, yy, size, 400, color, "left"); }
      return yy;
    };

    if (net.status === "connecting" || net.status === "idle") {
      card(76);
      text("Connecting…", w / 2, y + 45, 18, 700, "#331F73");
      return;
    }
    if (net.status === "unavailable") {
      const msg = "Online play needs everyone signed in to Claude and viewing this page on claude.ai or in the Claude app. "
        + "It doesn't work from a public link, or from a copy of the page saved elsewhere.";
      const lines = wrap(msg, cw - 40, 15, 400).length;
      card(70 + lines * 21);
      text("Online play isn't available here", x0 + 20, y + 34, 17, 700, "#331F73", "left");
      para(msg, 15, "rgba(51,31,115,.8)", y + 44);
      return;
    }

    const others = lobbyOthers();
    text(others.length ? "People here now" : "Waiting for your friend", x0 + 4, y + 4, 15, 700, "rgba(255,255,255,.85)", "left");
    y += 18;
    if (!others.length) {
      const msg = "Share this page with your friend: use the Share button at the top of the page and invite them. "
        + "When they open Pairo and tap Play Online, they'll appear here and you can challenge them.";
      const lines = wrap(msg, cw - 40, 15, 400).length;
      card(40 + lines * 21);
      para(msg, 15, "rgba(51,31,115,.85)", y + 12);
      // A gentle "searching" pulse.
      const k = (t / 1400) % 1;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(w / 2, y + 60 + lines * 21 + 50, 14 + 40 * k, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(w / 2, y + 60 + lines * 21 + 50, 10, 0, Math.PI * 2); ctx.fill();
      return;
    }
    for (const p of others.slice(0, 8)) {
      const pr = p.presence || {};
      const name = nameOf(p.by, "Player");
      const challengedMe = pr.challenge && pr.challenge.to === net.me;
      const iChallenged = net.challenge && net.challenge.to === p.peer;
      const busy = pr.mode === "playing";
      rrect(x0, y, cw, 68, 20, "#fff");
      // Avatar: initial on the person's colour.
      ctx.fillStyle = (p.by && net.colors[p.by]) || "#8A46C8";
      ctx.beginPath(); ctx.arc(x0 + 36, y + 34, 20, 0, Math.PI * 2); ctx.fill();
      text((name[0] || "?").toUpperCase(), x0 + 36, y + 41, 18, 900, "#fff");
      let label = name;
      while (label.length > 3 && measure(label, 17, 700) > cw - 250) label = label.slice(0, -2) + "…";
      text(label, x0 + 66, y + 30, 17, 700, "#331F73", "left");
      const sub = challengedMe ? (pr.challenge.mode === "army" ? "Challenges you: Armies!" : "Challenges you: Cards!")
        : busy ? "In a game" : pr.mode === "lobby" ? "Ready to play" : "Here now";
      text(sub, x0 + 66, y + 50, 13, 400, challengedMe ? "#C2410C" : "rgba(51,31,115,.65)", "left");
      const bx = x0 + cw - 118, by = y + 15;
      if (challengedMe) {
        const pulse = REDUCED ? 1 : 1 + 0.05 * Math.sin(t / 150);
        ctx.save(); ctx.translate(bx + 52, by + 19); ctx.scale(pulse, pulse); ctx.translate(-(bx + 52), -(by + 19));
        rrect(bx, by, 104, 38, 19, "#2A9D50"); text("Accept", bx + 52, by + 25, 15, 700, "#fff");
        ctx.restore();
        buttons.push({ x: bx, y: by, w: 104, h: 38, run: () => accept(p) });
      } else if (iChallenged) {
        rrect(bx, by, 104, 38, 19, "rgba(51,31,115,.12)"); text("Cancel", bx + 52, by + 25, 15, 700, "#331F73");
        buttons.push({ x: bx, y: by, w: 104, h: 38, run: cancelChallenge });
      } else if (!busy) {
        // Two ways to play: the card game, or two armies.
        const b1 = x0 + cw - 166, b2 = x0 + cw - 86;
        rrect(b1, by, 74, 38, 19, "#331F73"); text("Cards", b1 + 37, by + 25, 14, 700, "#fff");
        rrect(b2, by, 74, 38, 19, "#7A1F2B"); text("Armies", b2 + 37, by + 25, 14, 700, "#fff");
        buttons.push({ x: b1, y: by, w: 74, h: 38, run: () => challenge(p, "cards") });
        buttons.push({ x: b2, y: by, w: 74, h: 38, run: () => challenge(p, "army") });
      }
      y += 78;
    }
    if (net.challenge) {
      text("Waiting for them to accept…", w / 2, y + 22, 15, 700, "rgba(255,255,255,.9)");
    }
  }

  function drawMatch(w, h, t) {
    const m = net.match;
    if (!m) { screen = "online"; return; }
    const g = m.state, me = m.role === "host" ? 0 : 1, them = 1 - me;
    const oppName = nameOf(m.oppBy, "Your friend");
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2;
    closeButton(x0, 14, leaveMatch);
    soundButton(x0 + 50, 14);

    const army = m.mode === "army";
    if (army) {
      // Armies: a battlefield, and pips for the soldiers each side still has standing.
      if (g && g.phase !== "waiting") {
        const L = drawOnlineArmies(m, w, h, t);
        if (g.phase === "countdown") {
          const el = (t - m.seenPhaseAt) / 1000;
          bigNumber(String(Math.max(1, COUNTDOWN_S - Math.floor(el))), w / 2, L.bannerTop + L.bannerH / 2, el - Math.floor(el));
        } else if (g.phase === "playing" && t - m.seenPhaseAt < 600) {
          bigNumber("Charge!", w / 2, L.bannerTop + L.bannerH / 2, (t - m.seenPhaseAt) / 600);
        }
      } else {
        const field = ctx.createLinearGradient(0, 0, 0, h);
        field.addColorStop(0, "#3E5F2E"); field.addColorStop(1, "#6E8B3D");
        ctx.fillStyle = field; ctx.fillRect(0, 0, w, h);
      }
      ctx.fillStyle = "rgba(20,10,40,.55)"; ctx.fillRect(0, 0, w, 96);
      closeButton(x0, 14, leaveMatch);
      soundButton(x0 + 50, 14);
      commanderRow(w / 2, 80, oppName, ARMY_TARGET - (g ? g.s[me] : 0), ARMY_TARGET, ARMY[1].light);
      commanderRow(w / 2, h - 18, "Your army", ARMY_TARGET - (g ? g.s[them] : 0), ARMY_TARGET, ARMY[0].light);
    } else {
    // Scoreboards: opponent at the top, you at the bottom.
    scoreRow(w / 2, 82, oppName, g ? g.s[them] : 0, true);
    scoreRow(w / 2, h - 22, "You", g ? g.s[me] : 0, false);

    const avail = h - 230;
    const dc = Math.min(cw * 0.6, avail * 0.42), dh = Math.min(cw * 0.8, avail * 0.55);
    const cy = 104 + dc / 2, hy = h - 50 - dh / 2;
    m.centerY = cy;
    if (g && g.phase !== "waiting") {
      const hidden = g.phase === "countdown";
      const playing = g.phase === "playing";
      const center = cardFor(m, g.c), hand = cardFor(m, g.h[me]);
      const fly = Math.min(1, (t - center.flyAt) / FLY_MS);
      if (fly < 1 && !REDUCED) {
        const e = easeOut(fly);
        const from = center.flyFrom === 0 ? { x: w / 2, y: hy, d: dh } : { x: w / 2, y: 40, d: dc * 0.5 };
        drawCard(center, lerp(from.x, w / 2, e), lerp(from.y, cy, e), lerp(from.d, dc, e), {});
      } else {
        drawCard(center, w / 2, cy, dc, { hidden });
      }
      drawCard(hand, w / 2, hy, dh, {
        hidden, shakeX: shake(m.shakeAt), frozen: now() < m.frozenUntil,
        onTap: playing ? (s, sx, sy) => matchTap(s, sx, sy) : null
      });
      if (hidden) {
        const el = (t - m.seenPhaseAt) / 1000, n = Math.max(1, COUNTDOWN_S - Math.floor(el));
        bigNumber(String(n), w / 2, (cy + dc / 2 + hy - dh / 2) / 2, el - Math.floor(el));
      } else if (playing && t - m.seenPhaseAt < 500) {
        bigNumber("Go!", w / 2, (cy + dc / 2 + hy - dh / 2) / 2, (t - m.seenPhaseAt) / 500);
      }
    }
    }

    // Dialogs.
    if (m.failed) {
      panel(w, h, { title: "Couldn't start the game", body: "The game room didn't open. Go back and try the challenge again.",
        primary: { label: "Back", run: leaveMatch }, links: [] });
    } else if (m.oppLeft && !(g && g.phase === "over")) {
      panel(w, h, { title: `${oppName} left`, body: "The game ended because your friend closed the page or lost connection.",
        primary: { label: "Back", run: leaveMatch }, links: [] });
    } else if (!g || g.phase === "waiting") {
      if (m.role === "host") {
        panel(w, h, m.oppHere
          ? { title: `${oppName} is here!`, body: army
                ? `Armies of ${ARMY_TARGET}. Shoot ${oppName}'s soldier whose flag matches a symbol on the centre banner before they find yours. Wipe out their army to win.`
                : `First to ${TARGET} matches wins. Each of you matches your own card against the centre card.`,
              primary: { label: "Start", run: () => hostStart(m) }, links: [{ label: "Leave", run: leaveMatch }] }
          : { title: "Joining…", body: `Waiting for ${oppName} to join the game.`,
              primary: { label: "Cancel", run: leaveMatch }, links: [] });
      } else {
        panel(w, h, { title: m.oppHere ? "Get ready!" : "Joining…",
          body: m.oppHere ? `Waiting for ${oppName} to start the game.` : `Connecting to ${oppName}…`,
          primary: { label: "Leave", run: leaveMatch }, links: [] });
      }
    } else if (g.phase === "over") {
      const won = g.w === me;
      const body = (army ? `${ARMY_TARGET - g.s[them]} – ${ARMY_TARGET - g.s[me]} soldiers standing` : `${g.s[me]} – ${g.s[them]}`)
        + (m.role === "guest" ? `. Waiting for ${oppName} to start a rematch.` : "");
      panel(w, h, m.role === "host"
        ? { title: won ? "You win!" : `${oppName} wins`, body, primary: { label: "Rematch", run: () => hostStart(m) }, links: [{ label: "Leave", run: leaveMatch }] }
        : { title: won ? "You win!" : `${oppName} wins`, body, primary: { label: "Leave", run: leaveMatch }, links: [] });
    }
  }

  function scoreRow(cx, cy, label, score, top) {
    let name = label;
    while (name.length > 3 && measure(name, 17, 700) > 150) name = name.slice(0, -2) + "…";
    const lw = measure(name, 17, 700), total = lw + 14 + TARGET * 13 - 4;
    let x = cx - total / 2;
    text(name, x, cy + 6, 17, 700, "#fff", "left");
    x += lw + 14;
    for (let i = 0; i < TARGET; i++) {
      ctx.fillStyle = i < score ? (top ? "#FFD1D6" : "#fff") : "rgba(255,255,255,.27)";
      ctx.beginPath(); ctx.arc(x + i * 13 + 4.5, cy, 4.5, 0, 2 * Math.PI); ctx.fill();
    }
  }

  // ------------------------------------------------------------ Conquest: a strategy campaign
  // A map of territories joined by roads. You hold Highkeep (bottom); the Ash Legion holds
  // Dreadspire (top). Attack a territory next to yours: the battle is a Pairo match against a
  // computer commander, shaped by the territory's terrain. Territories earn gold each turn, gold
  // buys battle aids, and after every turn the Legion expands or attacks your border.
  const TERRAIN = {
    plains:   { name: "Plains",    effect: "Open ground, no tricks.",              cfg: {},                  income: 20 },
    forest:   { name: "Forest",    effect: "Forest winds: the symbols on the flags spin.",      cfg: { spin: true },      income: 15 },
    mountain: { name: "Mountains", effect: "Thin mountain air: some symbols are tiny.",     cfg: { tiny: true },      income: 15 },
    swamp:    { name: "Swamp",     effect: "Swamp mud: soldiers change places every few seconds.",     cfg: { reshuffle: true }, income: 15 },
    castle:   { name: "Castle",    effect: "Castle walls: the banner's symbols turn and the flags sway.",      cfg: { wheels: true },    income: 30 }
  };
  const MAP = [
    { name: "Highkeep",    x: 0.50, y: 0.94, terrain: "castle",   power: 0 },
    { name: "Willowmere",  x: 0.22, y: 0.80, terrain: "plains",   power: 1 },
    { name: "Brackenford", x: 0.76, y: 0.81, terrain: "forest",   power: 1 },
    { name: "Stonewatch",  x: 0.11, y: 0.63, terrain: "mountain", power: 2 },
    { name: "Mistvale",    x: 0.46, y: 0.66, terrain: "swamp",    power: 2 },
    { name: "Emberfield",  x: 0.86, y: 0.63, terrain: "plains",   power: 2 },
    { name: "Thornwood",   x: 0.27, y: 0.49, terrain: "forest",   power: 3 },
    { name: "Saltmarsh",   x: 0.66, y: 0.48, terrain: "swamp",    power: 3 },
    { name: "Frostpeak",   x: 0.09, y: 0.32, terrain: "mountain", power: 4 },
    { name: "Ravenmoor",   x: 0.47, y: 0.33, terrain: "plains",   power: 3 },
    { name: "Ironhold",    x: 0.88, y: 0.32, terrain: "castle",   power: 4 },
    { name: "Ashen Pass",  x: 0.28, y: 0.17, terrain: "mountain", power: 4 },
    { name: "Gloomfen",    x: 0.70, y: 0.17, terrain: "swamp",    power: 4 },
    { name: "Dreadspire",  x: 0.50, y: 0.04, terrain: "castle",   power: 5 }
  ];
  const ROADS = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 4], [2, 5], [3, 6], [4, 6], [4, 7], [5, 7], [5, 10], [6, 8], [6, 9],
    [7, 9], [7, 10], [8, 11], [9, 11], [9, 12], [10, 12], [11, 13], [12, 13]];
  const ADJ = MAP.map(() => []);
  for (const [a, b] of ROADS) { ADJ[a].push(b); ADJ[b].push(a); }
  const HOME = 0, DREAD = 13;
  /** Seconds the enemy commander needs per match, by territory power 1..5 (before difficulty). */
  const POWER_SECONDS = [0, 5.2, 4.4, 3.8, 3.3, 2.9];
  const DIFFICULTY = {
    easy:   { label: "Easy",   mul: 1.3,  mistakes: 0.14 },
    normal: { label: "Normal", mul: 1.0,  mistakes: 0.10 },
    hard:   { label: "Hard",   mul: 0.82, mistakes: 0.06 }
  };
  const ITEMS = {
    scout: { name: "Scout", price: 60,  desc: "Shows you the match for a moment." },
    frost: { name: "Frost", price: 100, desc: "Freezes the enemy commander for 4 seconds." },
    rally: { name: "Rally", price: 150, desc: "Adds 1 point to your score." }
  };
  const OWNER_COLOR = { you: "#1E78E6", enemy: "#E63946", neutral: "#8C8577" };
  const deckOrderFor = power => power <= 1 ? 3 : power === 2 ? 5 : 7;
  const targetFor = power => power <= 2 ? 5 : power <= 4 ? 6 : 7;

  const camp = {
    s: null,              // saved state: {v, diff, owner[], gold, turn, items, over}
    sel: -1,              // selected territory
    notices: [],          // dialogs to show on the map, in order
    toast: null,          // {text, at}
    shop: false,
    load() {
      try {
        const s = JSON.parse(load("pairo.conquest", "null"));
        if (s && s.v === 1 && Array.isArray(s.owner) && s.owner.length === MAP.length && DIFFICULTY[s.diff]) this.s = s;
      } catch { this.s = null; }
