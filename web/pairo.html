    },
    save() { store("pairo.conquest", JSON.stringify(this.s)); },
    newGame(diff) {
      const owner = MAP.map(() => "neutral");
      owner[HOME] = "you"; owner[DREAD] = "enemy"; owner[10] = "enemy";
      this.s = { v: 1, diff, owner, gold: 120, turn: 1, items: { scout: 1, frost: 0, rally: 0 }, over: null };
      this.sel = -1; this.notices = []; this.shop = false;
      this.save();
    },
    owned(who) { return this.s.owner.reduce((n, o) => n + (o === who ? 1 : 0), 0); },
    income() { return this.s.owner.reduce((g, o, i) => g + (o === "you" ? TERRAIN[MAP[i].terrain].income : 0), 0); },
    attackable(i) { return this.s.owner[i] !== "you" && ADJ[i].some(j => this.s.owner[j] === "you"); },
    powerOf(i) { return Math.min(5, MAP[i].power + (this.s.owner[i] === "enemy" && i !== DREAD ? 1 : 0)); }
  };
  camp.load();

  function openConquest() { camp.sel = -1; camp.shop = false; screen = "conquest"; }

  // ---- battle: two armies
  // Each army's front line raises flags, one symbol per soldier (the symbols of one card). The
  // centre banner shows the centre card. Exactly one enemy flag matches a symbol on the banner:
  // tap that soldier and your archers shoot him. The enemy commander hunts for YOUR soldier whose
  // flag matches the banner. After every kill both armies raise new flags under a new banner.
  // The army wiped out first loses.
  const VOLLEY_MS = 720, RAISE_MS = 380, SHUFFLE_MS = 2600, MOVE_MS = 420;
  const battle = {
    node: -1, defense: false, power: 1, target: 5, cfg: {}, deck: null, dealer: null,
    center: -1, cards: [-1, -1],          // card indices: banner, yours, the enemy's
    banner: [], flags: [[], []],          // symbols in display order (flags[0] yours, [1] enemy)
    sizes: [[], []], bannerSizes: [],     // symbol size multipliers (tiny symbols in the mountains)
    pos: [[], []], prev: [[], []], moveAt: [LONG_AGO, LONG_AGO], shuffleAt: 0,
    scores: [0, 0], phase: "intro",
    countdownAt: LONG_AGO, lastCount: -1, goAt: LONG_AGO, overAt: LONG_AGO, raiseAt: LONG_AGO,
    aiStartAt: 0, aiNextAt: 0, aiFrozenUntil: LONG_AGO, frozenUntil: LONG_AGO, shakeAt: LONG_AGO,
    volley: null, won: false, scoutUntil: LONG_AGO, rallied: false, layout: null
  };

  function newRound(t) {
    const b = battle, d = b.dealer;
    const c = d.draw(), y = d.draw(c), e = d.draw(c, y);
    b.center = c; b.cards = [y, e];
    b.banner = shuffle([...b.deck.cards[c]]);
    b.flags = [shuffle([...b.deck.cards[y]]), shuffle([...b.deck.cards[e]])];
    const sz = () => b.cfg.tiny ? 0.5 + rand() * 0.55 : 1;
    b.sizes = [b.flags[0].map(sz), b.flags[1].map(sz)];
    b.bannerSizes = b.banner.map(sz);
    b.pos = [b.flags[0].map((_, i) => i), b.flags[1].map((_, i) => i)];
    b.prev = [b.pos[0].slice(), b.pos[1].slice()];
    b.moveAt = [LONG_AGO, LONG_AGO];
    b.shuffleAt = t;
    b.raiseAt = t;
  }

  function startBattle(node, defense, power) {
    const b = battle;
    b.node = node; b.defense = defense; b.power = power; b.target = targetFor(power);
    b.cfg = { ...TERRAIN[MAP[node].terrain].cfg };
    b.deck = DECKS[deckOrderFor(power)];
    b.dealer = new Dealer(b.deck);
    newRound(now());
    b.scores = [0, 0]; b.phase = "intro"; b.volley = null; b.won = false; b.rallied = false;
    b.frozenUntil = LONG_AGO; b.aiFrozenUntil = LONG_AGO; b.scoutUntil = LONG_AGO; b.shakeAt = LONG_AGO;
    camp.sel = -1;
    screen = "battle";
  }

  function aiDelay() {
    const d = DIFFICULTY[camp.s.diff], b = battle;
    const terrainSlow = b.cfg.spin || b.cfg.tiny || b.cfg.reshuffle || b.cfg.wheels ? 1.08 : 1;
    return POWER_SECONDS[b.power] * d.mul * terrainSlow * (0.7 + 0.6 * rand()) * 1000;
  }
  function scheduleAi(t) { battle.aiStartAt = t; battle.aiNextAt = t + aiDelay(); }

  /** The flag (index into flags[side]) whose symbol matches the banner. */
  function matchingFlag(side) {
    const b = battle, sym = shared(b.deck, b.center, b.cards[side]);
    return b.flags[side].indexOf(sym);
  }

  function updateBattle(t, dt) {
    if (screen !== "battle") return;
    const b = battle;
    if (b.phase === "countdown") {
      const e = (t - b.countdownAt) / 1000, n = COUNTDOWN_S - Math.floor(e);
      if (e >= COUNTDOWN_S) {
        b.phase = "playing"; b.goAt = t; b.raiseAt = t; b.shuffleAt = t;
        scheduleAi(t);
        sound.go();
      } else if (n !== b.lastCount) { b.lastCount = n; sound.tick(); }
      return;
    }
    if (b.phase === "volley") {
      if (t - b.volley.at >= VOLLEY_MS) {
        const by = b.volley.by;
        b.volley = null;
        if (b.scores[by] >= b.target) finishBattle(by === 0);
        else { b.phase = "playing"; newRound(t); scheduleAi(t); }
      }
      return;
    }
    if (b.phase !== "playing") return;
    // Swamp: soldiers change places every few seconds.
    if (b.cfg.reshuffle && t - b.shuffleAt > SHUFFLE_MS) {
      b.shuffleAt = t;
      for (const side of [0, 1]) {
        b.prev[side] = b.pos[side].slice();
        b.pos[side] = shuffle(b.pos[side].slice());
        b.moveAt[side] = t;
      }
    }
    // The enemy commander.
    if (t >= b.aiNextAt && t >= b.aiFrozenUntil) {
      if (rand() < DIFFICULTY[camp.s.diff].mistakes) {
        b.aiFrozenUntil = t + FREEZE_MS;
        b.aiStartAt = b.aiFrozenUntil; b.aiNextAt = b.aiFrozenUntil + aiDelay() * 0.6;
      } else {
        claim(1);
      }
    }
  }

  /** Side p shoots the other army's soldier whose flag matches the banner. */
  function claim(p) {
    const b = battle, t = now(), side = 1 - p;
    b.scores[p]++;
    b.volley = { by: p, side, idx: matchingFlag(side), at: t };
    b.phase = "volley";
    if (p === 1) { sound.oppScore(); haptic(8); }
  }

  function playerTap(i, sx, sy) {
    const b = battle;
    if (b.phase !== "playing" || now() < b.frozenUntil) return;
    if (i === matchingFlag(1)) {
      sound.match(); haptic(15);
      claim(0);
    } else {
      sound.miss(); haptic([30, 40, 30]);
      xMark(sx, sy, false);
      b.frozenUntil = now() + FREEZE_MS; b.shakeAt = now();
    }
  }

  function useItem(kind) {
    const b = battle, s = camp.s;
    if (b.phase !== "playing" || !s.items[kind]) return;
    const t = now();
    if (kind === "scout") { b.scoutUntil = t + 1400; }
    else if (kind === "frost") {
      b.aiFrozenUntil = Math.max(b.aiFrozenUntil, t) + 4000;
      b.aiStartAt = b.aiFrozenUntil; b.aiNextAt = b.aiFrozenUntil + aiDelay() * 0.6;
    } else if (kind === "rally") {
      if (b.rallied) return;
      b.rallied = true;
      b.scores[0]++;
      floatText("A soldier deserts!", W / 2, H * 0.3, "#FFE08A", false);
      if (b.scores[0] >= b.target) finishBattle(true);
    }
    s.items[kind]--;
    camp.save();
    sound.star();
  }

  function finishBattle(won) {
    const b = battle;
    b.phase = "over"; b.won = won; b.overAt = now();
    if (won) { sound.win(); confetti(W); } else sound.timeup();
  }

  function retreat() {
    const b = battle;
    if (b.phase === "intro" && !b.defense) { screen = "conquest"; return; }
    if (b.phase !== "over") { b.volley = null; finishBattle(false); }
  }

  /** Applies a finished battle to the campaign, then runs the enemy's turn. */
  function applyBattle() {
    const b = battle, s = camp.s, name = MAP[b.node].name;
    screen = "conquest";
    if (!b.defense) {
      if (b.won) {
        s.owner[b.node] = "you";
        const bonus = 25 * b.power;
        s.gold += bonus;
        if (b.node === DREAD) {
          s.over = "won";
          camp.save();
          camp.notices.push({ title: "Victory!", body: `Dreadspire has fallen and the Ash Legion is broken. You conquered the realm in ${s.turn} turns on ${DIFFICULTY[s.diff].label}.`,
            primary: { label: "New campaign", run: () => { camp.s = null; camp.save(); } }, links: [{ label: "Menu", run: () => { screen = "menu"; } }] });
          confetti(W);
          return;
        }
        camp.toast = { text: `${name} is yours! +${bonus} gold`, at: now() };
      } else {
        camp.toast = { text: `Your army fell back from ${name}.`, at: now() };
      }
      endTurn();
    } else {
      if (b.won) {
        const bonus = 20 * b.power;
        s.gold += bonus;
        camp.toast = { text: `${name} holds! +${bonus} gold`, at: now() };
      } else {
        s.owner[b.node] = "enemy";
        if (b.node === HOME) {
          s.over = "lost";
          camp.notices.push({ title: "Highkeep has fallen", body: "The Ash Legion took your capital. The campaign is lost, but the realm can be fought for again.",
            primary: { label: "New campaign", run: () => { camp.s = null; camp.save(); } }, links: [{ label: "Menu", run: () => { screen = "menu"; } }] });
        } else {
          camp.toast = { text: `${name} was lost to the Ash Legion.`, at: now() };
        }
      }
      camp.save();
    }
  }

  /** Income, then the Ash Legion moves: it attacks your border or takes a neutral territory. */
  function endTurn() {
    const s = camp.s;
    s.turn++;
    const income = camp.income();
    s.gold += income;
    const enemy = [], border = [], neutralNext = [];
    s.owner.forEach((o, i) => { if (o === "enemy") enemy.push(i); });
    s.owner.forEach((o, i) => {
      const nearEnemy = ADJ[i].some(j => s.owner[j] === "enemy");
      if (o === "you" && nearEnemy) border.push(i);
      if (o === "neutral" && nearEnemy) neutralNext.push(i);
    });
    const pAttack = Math.min(0.6, 0.2 + s.turn * 0.035);
    if (border.length && rand() < pAttack) {
      const outer = border.filter(i => i !== HOME);
      const target = (outer.length ? outer : border)[Math.floor(rand() * (outer.length ? outer.length : border.length))];
      const power = Math.max(2, Math.min(5, 2 + Math.floor(s.turn / 4)));
      const name = MAP[target].name;
      camp.notices.push({
        title: target === HOME ? "Highkeep is under siege!" : "Under attack!",
        body: `The Ash Legion marches on ${name}. Win the battle to hold it` + (target === HOME ? "; lose, and the campaign is over." : ", or let it go."),
        primary: { label: "Defend", run: () => startBattle(target, true, power) },
        links: target === HOME ? [] : [{ label: "Give it up", run: () => {
          s.owner[target] = "enemy"; camp.save();
          camp.toast = { text: `${name} was lost to the Ash Legion.`, at: now() };
        } }]
      });
    } else if (neutralNext.length && rand() < 0.6) {
      const i = neutralNext[Math.floor(rand() * neutralNext.length)];
      s.owner[i] = "enemy";
      camp.toast = { text: `The Ash Legion took ${MAP[i].name}. Your lands earn +${income} gold.`, at: now() };
    } else if (!camp.toast || now() - camp.toast.at > 50) {
      camp.toast = { text: `Your lands earn +${income} gold.`, at: now() };
    }
    camp.save();
  }

  function buy(kind) {
    const s = camp.s, item = ITEMS[kind];
    if (s.gold < item.price) return;
    s.gold -= item.price; s.items[kind]++;
    camp.save();
    sound.click();
  }

  // ---- drawing: the map
  function terrainIcon(kind, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    if (kind === "plains") {
      ctx.fillStyle = "#F2B600"; ctx.beginPath(); ctx.arc(s * 0.25, -s * 0.25, s * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6BAA4A"; ctx.beginPath(); ctx.ellipse(-s * 0.1, s * 0.35, s * 0.75, s * 0.35, 0, Math.PI, 0); ctx.fill();
    } else if (kind === "forest") {
      for (const [dx, sz] of [[-0.32, 0.9], [0.3, 1.05]]) {
        ctx.fillStyle = "#7A5230"; ctx.fillRect(dx * s - s * 0.06, s * 0.25, s * 0.12, s * 0.3);
        ctx.fillStyle = "#2A7D46";
        ctx.beginPath(); ctx.moveTo(dx * s, -s * 0.55 * sz); ctx.lineTo(dx * s + s * 0.35 * sz, s * 0.3); ctx.lineTo(dx * s - s * 0.35 * sz, s * 0.3); ctx.closePath(); ctx.fill();
      }
    } else if (kind === "mountain") {
      ctx.fillStyle = "#7C7F8C";
      ctx.beginPath(); ctx.moveTo(-s * 0.75, s * 0.45); ctx.lineTo(-s * 0.15, -s * 0.55); ctx.lineTo(s * 0.2, s * 0.05); ctx.lineTo(s * 0.4, -s * 0.25); ctx.lineTo(s * 0.8, s * 0.45); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.moveTo(-s * 0.15, -s * 0.55); ctx.lineTo(s * 0.02, -s * 0.27); ctx.lineTo(-s * 0.3, -s * 0.3); ctx.closePath(); ctx.fill();
    } else if (kind === "swamp") {
      ctx.strokeStyle = "#2E9C9C"; ctx.lineWidth = s * 0.14; ctx.lineCap = "round";
      for (const dy of [-0.25, 0.05, 0.35]) {
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const px = -s * 0.65 + i * s * 0.11, py = dy * s + Math.sin(i * 0.9) * s * 0.08;
          if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        }
        ctx.stroke();
      }
    } else if (kind === "castle") {
      ctx.fillStyle = "#6B6577";
      ctx.fillRect(-s * 0.55, -s * 0.15, s * 1.1, s * 0.7);
      ctx.fillRect(-s * 0.25, -s * 0.6, s * 0.5, s * 0.6);
      for (const cx of [-0.55, -0.2, 0.2, 0.45]) ctx.fillRect(cx * s, -s * 0.3, s * 0.15, s * 0.16);
      for (const cx of [-0.25, -0.05, 0.15]) ctx.fillRect(cx * s, -s * 0.75, s * 0.12, s * 0.16);
      ctx.fillStyle = "#3A3446"; ctx.beginPath(); ctx.arc(0, s * 0.55, s * 0.18, Math.PI, 0); ctx.fill();
    }
    ctx.restore();
  }

  function mapGeometry(w, h) {
    const cw = Math.min(w - 40, 520), x0 = (w - cw) / 2, top = 112, bottom = h - 124;
    return { cw, x0, top, bottom, px: i => x0 + MAP[i].x * cw, py: i => top + MAP[i].y * (bottom - top) };
  }

  function drawConquest(w, h, t) {
    // Sea.
    const sea = ctx.createLinearGradient(0, 0, 0, h);
    sea.addColorStop(0, "#1B1446"); sea.addColorStop(1, "#2F1C63");
    ctx.fillStyle = sea; ctx.fillRect(0, 0, w, h);
    // Gentle waves.
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 2;
    for (let y = 30; y < h; y += 34) {
      ctx.beginPath();
      for (let x = -20; x <= w + 20; x += 20) ctx.lineTo(x, y + Math.sin((x + t / 40 + y) / 30) * 3);
      ctx.stroke();
    }
    ctx.restore();

    const cwh = Math.min(w - 32, 488), hx0 = (w - cwh) / 2;
    closeButton(hx0, 14, () => { screen = "menu"; });
    text("Conquest", w / 2, 44, 24, 900, "#fff");

    if (!camp.s) {
      drawMapLand(w, h, t, true);
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      panel(w, h, {
        title: "Conquest", subtitle: "A strategy campaign",
        body: "Lead the Azure Crown from Highkeep and capture the realm one territory at a time. Every attack is a Pairo match against an enemy commander, shaped by the land: spinning forests, tiny mountain symbols, shifting swamps and castle wheels. Territories earn gold for battle aids, and the Ash Legion strikes back. Take Dreadspire to win.",
        primary: { label: "Start on Normal", run: () => camp.newGame("normal") },
        links: [{ label: "Easy", run: () => camp.newGame("easy") }, { label: "Hard", run: () => camp.newGame("hard") }]
      });
      return;
    }
    const s = camp.s;
    // Gold and turn.
    const goldLabel = `${s.gold}`;
    const gw = measure(goldLabel, 16, 700) + 44;
    rrect(hx0 + cwh - gw, 17, gw, 34, 17, "rgba(255,255,255,.18)");
    ctx.fillStyle = "#F2B600"; ctx.beginPath(); ctx.arc(hx0 + cwh - gw + 18, 34, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#B57F00"; ctx.lineWidth = 2; ctx.stroke();
    text(goldLabel, hx0 + cwh - gw + 32, 40, 16, 700, "#fff", "left");
    drawMapLand(w, h, t, false);

    // Turn summary, on its own pill so the island never hides it.
    const summary = `Turn ${s.turn}  ·  ${camp.owned("you")}/${MAP.length} lands  ·  +${camp.income()} gold a turn  ·  ${DIFFICULTY[s.diff].label}`;
    const sw = Math.min(w - 32, measure(summary, 13, 700) + 28);
    rrect((w - sw) / 2, 60, sw, 26, 13, "rgba(27,20,70,.88)");
    text(summary, w / 2, 78, 13, 700, "rgba(255,255,255,.85)");

    // Bottom bar.
    const by = h - 70;
    if (camp.sel >= 0) {
      drawTerritorySheet(w, h, camp.sel);
    } else {
      const bw = Math.min(cwh, 360);
      bigButton((w - bw) / 2, by, bw, 50, "Shop", false, () => { camp.shop = true; });
      text(s.items.scout || s.items.frost || s.items.rally ? `Scout ×${s.items.scout}   Frost ×${s.items.frost}   Rally ×${s.items.rally}` : "Tap a glowing territory to attack it",
        w / 2, by - 12, 13, 700, "rgba(255,255,255,.8)");
    }

    // Toast.
    if (camp.toast) {
      const k = (now() - camp.toast.at) / 3800;
      if (k > 1) camp.toast = null;
      else {
        ctx.save(); ctx.globalAlpha = Math.min(1, (1 - k) * 5);
        const tw = Math.min(w - 32, measure(camp.toast.text, 14, 700) + 32);
        rrect((w - tw) / 2, 90, tw, 34, 17, "rgba(20,14,50,.92)");
        text(camp.toast.text, w / 2, 112, 14, 700, "#fff");
        ctx.restore();
      }
    }

    if (camp.shop) drawShop(w, h);
    else if (camp.notices.length) {
      const n = camp.notices[0];
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      panel(w, h, {
        ...n,
        primary: { label: n.primary.label, run: () => { camp.notices.shift(); n.primary.run(); } },
        links: (n.links || []).map(L => ({ label: L.label, run: () => { camp.notices.shift(); L.run(); } }))
      });
    }
  }

  function drawMapLand(w, h, t, dim) {
    const g = mapGeometry(w, h), R = g.cw * 0.2;
    const s = camp.s;
    // Land: an outline pass, then the parchment, so the territories read as one island.
    ctx.fillStyle = "#5B4630";
    for (let i = 0; i < MAP.length; i++) { ctx.beginPath(); ctx.arc(g.px(i), g.py(i), R + 4, 0, Math.PI * 2); ctx.fill(); }
    for (const [a, b] of ROADS) {
      ctx.strokeStyle = "#5B4630"; ctx.lineWidth = R * 1.6 + 8;
      ctx.beginPath(); ctx.moveTo(g.px(a), g.py(a)); ctx.lineTo(g.px(b), g.py(b)); ctx.stroke();
    }
    ctx.fillStyle = "#D9C9A0";
    for (let i = 0; i < MAP.length; i++) { ctx.beginPath(); ctx.arc(g.px(i), g.py(i), R, 0, Math.PI * 2); ctx.fill(); }
    for (const [a, b] of ROADS) {
      ctx.strokeStyle = "#D9C9A0"; ctx.lineWidth = R * 1.6;
      ctx.beginPath(); ctx.moveTo(g.px(a), g.py(a)); ctx.lineTo(g.px(b), g.py(b)); ctx.stroke();
    }
    // A little texture: soft green meadows near each territory.
    ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = "#6BAA4A";
    for (let i = 0; i < MAP.length; i++) { ctx.beginPath(); ctx.arc(g.px(i) - R * 0.3, g.py(i) + R * 0.25, R * 0.45, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    // Roads.
    ctx.save();
    ctx.setLineDash([6, 6]); ctx.lineCap = "round"; ctx.lineWidth = 3; ctx.strokeStyle = "#9A7B4F";
    for (const [a, b] of ROADS) { ctx.beginPath(); ctx.moveTo(g.px(a), g.py(a)); ctx.lineTo(g.px(b), g.py(b)); ctx.stroke(); }
    ctx.restore();
    if (dim || !s) return;

    // Territories.
    for (let i = 0; i < MAP.length; i++) {
      const x = g.px(i), y = g.py(i), o = s.owner[i], col = OWNER_COLOR[o];
      const canAttack = !s.over && camp.attackable(i);
      if (canAttack) {
        const k = REDUCED ? 0.5 : 0.5 + 0.5 * Math.sin(t / 300 + i);
        ctx.save(); ctx.globalAlpha = 0.45 + 0.45 * k;
        ctx.strokeStyle = "#F2B600"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, 30 + 3 * k, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
      if (camp.sel === i) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, 33, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = "rgba(40,26,20,.35)"; ctx.beginPath(); ctx.arc(x + 1, y + 3, 24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#FBF6EA"; ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.stroke();
      terrainIcon(MAP[i].terrain, x, y, 15);
      // Banner.
      ctx.strokeStyle = "#4A3A2A"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 16, y - 16); ctx.lineTo(x + 16, y - 38); ctx.stroke();
      const wave = REDUCED ? 0 : Math.sin(t / 250 + i) * 2;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x + 16, y - 38); ctx.lineTo(x + 32, y - 33 + wave); ctx.lineTo(x + 16, y - 28); ctx.closePath(); ctx.fill();
      // Name and strength.
      const label = MAP[i].name;
      const lw = measure(label, 11, 700) + 10;
      rrect(x - lw / 2, y + 27, lw, 16, 8, "rgba(251,246,234,.92)");
      text(label, x, y + 39, 11, 700, "#3B2E22");
      if (o !== "you") {
        const p = camp.powerOf(i);
        for (let k = 0; k < p; k++) {
          ctx.fillStyle = o === "enemy" ? "#E63946" : "#6B6577";
          ctx.beginPath(); ctx.arc(x - (p - 1) * 5 + k * 10, y + 50, 3.5, 0, Math.PI * 2); ctx.fill();
        }
      }
      buttons.push({ x: x - 30, y: y - 40, w: 60, h: 80, run: () => { camp.sel = camp.sel === i ? -1 : i; sound.click(); } });
    }
  }

  function drawTerritorySheet(w, h, i) {
    const s = camp.s, m = MAP[i], ter = TERRAIN[m.terrain], o = s.owner[i];
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2, sh = 178, y = h - sh - 12;
    buttons.push({ x: x0, y, w: cw, h: sh, run: () => {} });
    rrect(x0, y, cw, sh, 24, "#fff");
    terrainIcon(m.terrain, x0 + 40, y + 42, 18);
    text(m.name, x0 + 72, y + 38, 20, 900, "#331F73", "left");
    const ownerText = o === "you" ? "Yours" : o === "enemy" ? "Held by the Ash Legion" : "Neutral";
    text(`${ter.name}  ·  ${ownerText}  ·  +${ter.income} gold a turn`, x0 + 72, y + 58, 13, 400, "rgba(51,31,115,.7)", "left");
    closeButton(x0 + cw - 50, y + 10, () => { camp.sel = -1; });
    // The close button is white-on-dark; redraw it dark on this light sheet.
    ctx.strokeStyle = "#331F73"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0 + cw - 36, y + 24); ctx.lineTo(x0 + cw - 24, y + 36); ctx.moveTo(x0 + cw - 24, y + 24); ctx.lineTo(x0 + cw - 36, y + 36); ctx.stroke();
    if (o === "you") {
      text(i === HOME ? "Your capital. Lose it and the campaign is over." : "Defend it when the Ash Legion attacks.", x0 + 20, y + 98, 15, 400, "#331F73", "left");
      return;
    }
    const p = camp.powerOf(i), order = deckOrderFor(p);
    const lines = wrap(`Power ${p}. Armies of ${targetFor(p)} soldiers, ${order + 1} flags per side. ${ter.effect}`, cw - 40, 15, 400);
    lines.slice(0, 2).forEach((l, k) => text(l, x0 + 20, y + 92 + k * 20, 15, 400, "#331F73", "left"));
    if (camp.attackable(i) && !s.over) {
      bigButton(x0 + 20, y + sh - 64, cw - 40, 50, `Attack ${m.name}`, true, () => startBattle(i, false, p));
    } else {
      text("Capture a neighbouring territory first.", x0 + 20, y + sh - 30, 14, 700, "rgba(51,31,115,.6)", "left");
    }
  }

  function drawShop(w, h) {
    const s = camp.s, cw = Math.min(w - 32, 400), x0 = (w - cw) / 2, ph = 92 + 3 * 82 + 60, y0 = Math.max(16, (h - ph) / 2);
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, w, h);
    buttons.push({ x: 0, y: 0, w, h, run: () => {} });
    rrect(x0, y0, cw, ph, 28, "rgba(51,31,115,.96)");
    text("Shop", w / 2, y0 + 46, 28, 900, "#fff");
    text(`You have ${s.gold} gold`, w / 2, y0 + 72, 14, 700, "#F2D06B");
    let y = y0 + 92;
    for (const [kind, item] of Object.entries(ITEMS)) {
      rrect(x0 + 16, y, cw - 32, 70, 18, "rgba(255,255,255,.1)");
      text(`${item.name}  ×${s.items[kind]}`, x0 + 32, y + 28, 17, 700, "#fff", "left");
      for (const [k, line] of wrap(item.desc, cw - 170, 12, 400).slice(0, 2).entries()) {
        text(line, x0 + 32, y + 48 + k * 15, 12, 400, "rgba(255,255,255,.75)", "left");
      }
      const can = s.gold >= item.price, bx = x0 + cw - 120, by = y + 16;
      rrect(bx, by, 92, 38, 19, can ? "#F2B600" : "rgba(255,255,255,.15)");
      text(`${item.price}`, bx + 46, by + 25, 15, 900, can ? "#331F73" : "rgba(255,255,255,.5)");
      if (can) buttons.push({ x: bx, y: by, w: 92, h: 38, run: () => buy(kind) });
      y += 82;
    }
    bigButton(x0 + 24, y + 4, cw - 48, 46, "Done", false, () => { camp.shop = false; });
  }

  // ---- drawing: armies (shared by Conquest battles, same-phone Battle and online army matches)
  // Side 1 is the army at the top of the screen, side 0 the army at the bottom.
  const ARMY = {
    0: { cloth: "#1E78E6", dark: "#123C7A", light: "#7FB2F5", name: "Azure Crown" },
    1: { cloth: "#D7263D", dark: "#6E1220", light: "#F59AA6", name: "Ash Legion" }
  };
  const ARMY_TARGET = 7;   // soldiers per army in player-against-player battles
  const clamp01 = v => Math.max(0, Math.min(1, v));

  /** Where two facing armies of k flag-bearers, the banner and an optional row of aids sit. */
  function armyLayout(w, h, k, top, bottom, aidsH) {
    const cw = Math.min(w - 24, 500), x0 = (w - cw) / 2;
    const cols = k <= 4 ? k : k / 2, rows = k <= 4 ? 1 : 2;
    const bCols = cols, bRows = rows;
    const cell = Math.min(k <= 4 ? 72 : 54, (cw * 0.62) / bCols);
    const bannerW = bCols * cell + 24, bannerH = bRows * cell + 20;
    const avail = bottom - top - aidsH - bannerH - 36;
    const rowH = Math.max(60, Math.min(rows === 1 ? 175 : 126, avail / (2 * rows)));
    const colW = cw / cols;
    const flagW = Math.min(rows === 1 ? 98 : 74, colW * 0.8, rowH * 0.62), flagH = flagW * 0.74;
    const used = 2 * rows * rowH + 12 + bannerH + 14 + aidsH;
    const enemyTop = top + Math.max(0, (bottom - top - used) / 2);
    const bannerTop = enemyTop + rows * rowH + 12;
    const aidsY = bannerTop + bannerH + 14;
    const mineTop = aidsY + aidsH;
    const slot = (side, p) => {
      const r = Math.floor(p / cols), c = p % cols;
      return { x: x0 + (c + 0.5) * colW, top: (side === 1 ? enemyTop : mineTop) + r * rowH };
    };
    return { cw, x0, cols, rows, cell, bannerW, bannerH, bCols, bRows, rowH, colW, flagW, flagH, enemyTop, bannerTop, aidsY, mineTop, slot };
  }

  /** A soldier holding a flag overhead. `raise` 0..1 lifts the flag; `fall` 0..1 knocks him over. */
  function drawSoldier(x, top, L, side, sym, sizeMul, o) {
    const { raise = 1, fall = 0, frozen = false, glow = false, spin = 0, sway = 0 } = o;
    const army = ARMY[side];
    const feet = top + L.rowH - 6, s = Math.min(L.rowH * 0.42, L.colW * 0.5);
    ctx.save();
    if (fall > 0) {
      ctx.translate(x, feet); ctx.rotate((side === 1 ? -1 : 1) * fall * Math.PI / 2); ctx.translate(-x, -feet);
      ctx.globalAlpha = 1 - fall * 0.65;
    }
    ctx.fillStyle = "rgba(20,10,40,.28)";
    ctx.beginPath(); ctx.ellipse(x, feet + 2, s * 0.32, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = army.dark;
    ctx.fillRect(x - s * 0.13, feet - s * 0.2, s * 0.09, s * 0.2);
    ctx.fillRect(x + s * 0.04, feet - s * 0.2, s * 0.09, s * 0.2);
    ctx.fillStyle = army.cloth;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, feet - s * 0.18); ctx.lineTo(x + s * 0.2, feet - s * 0.18);
    ctx.lineTo(x + s * 0.16, feet - s * 0.56); ctx.lineTo(x - s * 0.16, feet - s * 0.56); ctx.closePath(); ctx.fill();
    const hy = feet - s * 0.68;
    ctx.fillStyle = "#F1C9A5"; ctx.beginPath(); ctx.arc(x, hy, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = army.dark; ctx.beginPath(); ctx.arc(x, hy - s * 0.02, s * 0.13, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - s * 0.16, hy - s * 0.03, s * 0.32, s * 0.04);
    ctx.fillStyle = army.light; ctx.strokeStyle = army.dark; ctx.lineWidth = Math.max(1.5, s * 0.03);
    ctx.beginPath(); ctx.arc(x - s * 0.2, feet - s * 0.36, s * 0.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const flagBottom = lerp(hy - s * 0.1, top + 4 + L.flagH, raise);
    ctx.strokeStyle = "#6B4A2B"; ctx.lineWidth = Math.max(2, s * 0.045); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x + s * 0.02, feet - s * 0.5); ctx.lineTo(x + s * 0.02, flagBottom - L.flagH - 4); ctx.stroke();
    ctx.strokeStyle = army.cloth; ctx.lineWidth = Math.max(2, s * 0.06);
    ctx.beginPath(); ctx.moveTo(x - s * 0.14, feet - s * 0.5); ctx.lineTo(x + s * 0.02, feet - s * 0.62); ctx.moveTo(x + s * 0.16, feet - s * 0.5); ctx.lineTo(x + s * 0.02, feet - s * 0.62); ctx.stroke();
    if (raise > 0.02) {
      const fw = L.flagW, fh = L.flagH, fx = x + s * 0.02 - fw / 2, fy = flagBottom - fh;
      ctx.save();
      ctx.globalAlpha *= Math.min(1, raise * 1.4);
      ctx.translate(x, fy + fh / 2); ctx.rotate(sway); ctx.translate(-x, -(fy + fh / 2));
      if (glow) { ctx.shadowColor = "#F2B600"; ctx.shadowBlur = 18; }
      ctx.fillStyle = frozen ? "#DCEBFF" : "#FFFDF7";
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + fw, fy);
      for (let i = 0; i <= 8; i++) ctx.lineTo(fx + fw - i * fw / 8, fy + fh + Math.sin(i * 1.4 + now() / 220) * fh * 0.04);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = glow ? "#F2B600" : army.cloth; ctx.lineWidth = glow ? 4 : 3; ctx.stroke();
      drawSymbol(ctx, sym, fx + fw / 2, fy + fh / 2, fh * 0.72 * sizeMul, spin);
      if (frozen) { ctx.fillStyle = "rgba(30,120,230,.18)"; ctx.fillRect(fx, fy, fw, fh); }
      ctx.restore();
    }
    ctx.restore();
  }

  /**
   * Both armies. v = { flags: [bottom[], top[]], sizes?, pos?, prev?, moveAt?, rise, frozen: [b, t],
   * volley?: {side, idx, at}, flipTop?, glow?: {side, idx}, spin?, sway?, shake?: [b, t], onTap?: [fn|null, fn|null] }.
   * A flipped top army stands upside down, facing a second player across the table.
   */
  function drawArmies(L, t, v) {
    for (const side of [1, 0]) {
      v.flags[side].forEach((sym, i) => {
        const pos = v.pos ? v.pos[side][i] : i, prev = v.prev ? v.prev[side][i] : pos;
        const e = v.moveAt ? easeOut(clamp01((t - v.moveAt[side]) / MOVE_MS)) : 1;
        const a = L.slot(side, prev), z = L.slot(side, pos);
        const x = lerp(a.x, z.x, e) + (v.shake ? v.shake[side] : 0), top = lerp(a.top, z.top, e);
        const vo = v.volley;
        const fall = vo && vo.side === side && vo.idx === i ? clamp01((t - vo.at - 230) / 300) : 0;
        const raise = clamp01((v.rise * (RAISE_MS + 160) - i * 20) / RAISE_MS);
        const flip = side === 1 && v.flipTop;
        ctx.save();
        if (flip) { const cy = top + L.rowH / 2; ctx.translate(x, cy); ctx.rotate(Math.PI); ctx.translate(-x, -cy); }
        drawSoldier(x, top, L, side, sym, v.sizes ? v.sizes[side][i] : 1, {
          raise, fall, frozen: v.frozen[side], glow: !!v.glow && v.glow.side === side && v.glow.idx === i,
          spin: v.spin && !REDUCED ? t / 1000 * (i % 2 ? 1.2 : -1.2) + side : 0,
          sway: Math.sin(t / 400 + i) * (v.sway ? 0.09 : 0.04)
        });
        ctx.restore();
        const tap = v.onTap && v.onTap[side];
        if (tap) buttons.push({ x: x - L.colW / 2, y: top, w: L.colW, h: L.rowH, run: () => tap(i, x, top + L.rowH / 2) });
      });
    }
  }

  function drawBanner(w, L, t, hidden, symbols, sizes, turning) {
    const x = w / 2 - L.bannerW / 2, y = L.bannerTop;
    ctx.strokeStyle = "#6B4A2B"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x - 6, y - 8); ctx.lineTo(x - 6, y + L.bannerH + 14); ctx.stroke();
    ctx.fillStyle = "#F2B600"; ctx.beginPath(); ctx.arc(x - 6, y - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.shadowColor = "rgba(20,10,40,.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.fillStyle = "#FFF7DD";
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i <= 10; i++) ctx.lineTo(x + i * L.bannerW / 10, y + Math.sin(i * 0.9 + t / 300) * 2.5);
    ctx.lineTo(x + L.bannerW, y + L.bannerH);
    for (let i = 10; i >= 0; i--) ctx.lineTo(x + i * L.bannerW / 10, y + L.bannerH + Math.sin(i * 0.9 + t / 300) * 2.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#C99700"; ctx.lineWidth = 4;
    ctx.strokeRect(x + 4, y + 4, L.bannerW - 8, L.bannerH - 8);
    if (hidden) { text("?", w / 2, y + L.bannerH / 2 + 14, 40, 900, "rgba(51,31,115,.25)"); return; }
    symbols.forEach((sym, i) => {
      const r = Math.floor(i / L.bCols), c = i % L.bCols;
      const cx = x + 12 + (c + 0.5) * L.cell, cy = y + 10 + (r + 0.5) * L.cell;
      const turn = turning && !REDUCED ? t / 1000 * (i % 2 ? -0.9 : 0.9) : 0;
      drawSymbol(ctx, sym, cx, cy, L.cell * 0.74 * (sizes ? sizes[i] : 1), turn);
    });
  }

  /** An arrow from the shooting army to the soldier it hits; a burst when it lands. */
  function drawVolley(w, L, t, vo, pos) {
    if (!vo) return;
    const k = clamp01((t - vo.at) / 230);
    const target = L.slot(vo.side, pos != null ? pos : vo.idx);
    const tx = target.x, ty = target.top + L.rowH * 0.55;
    const sx = w / 2, sy = vo.side === 1 ? L.mineTop + 10 : L.bannerTop - 4;
    const ax = lerp(sx, tx, k), ay = lerp(sy, ty, k), ang = Math.atan2(ty - sy, tx - sx);
    if (k < 1) {
      ctx.save();
      ctx.strokeStyle = "#3B2A1A"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ax - Math.cos(ang) * 26, ay - Math.sin(ang) * 26); ctx.lineTo(ax, ay); ctx.stroke();
      ctx.fillStyle = "#3B2A1A";
      ctx.beginPath(); ctx.moveTo(ax + Math.cos(ang) * 6, ay + Math.sin(ang) * 6);
      ctx.lineTo(ax + Math.cos(ang + 2.5) * 8, ay + Math.sin(ang + 2.5) * 8);
      ctx.lineTo(ax + Math.cos(ang - 2.5) * 8, ay + Math.sin(ang - 2.5) * 8); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (!vo.hit) {
      vo.hit = true;
      burst(tx, ty, ARMY[vo.side].cloth);
      if (vo.label) floatText(vo.label, tx, target.top + 10, "#fff", !!vo.flipLabel);
    }
  }

  function drawField(w, h, L) {
    const field = ctx.createLinearGradient(0, 0, 0, h);
    field.addColorStop(0, "#3E5F2E"); field.addColorStop(0.5, "#6E8B3D"); field.addColorStop(1, "#3E5F2E");
    ctx.fillStyle = field; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(160,130,80,.25)"; ctx.fillRect(0, L.bannerTop - 14, w, L.bannerH + 28);
  }

  /** A label with one pip per soldier still standing. */
  function commanderRow(cx, cy, label, alive, total, color) {
    const lw = measure(label, 15, 700), n = Math.max(0, alive), tw = lw + 12 + total * 14 - 4;
    let x = cx - tw / 2;
    text(label, x, cy + 5, 15, 700, "#fff", "left");
    x += lw + 12;
    for (let i = 0; i < total; i++) {
      ctx.fillStyle = i < n ? color : "rgba(255,255,255,.22)";
      ctx.beginPath(); ctx.arc(x + i * 14 + 5, cy, 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- Conquest battle screen
  function battleLayout(w, h) { return armyLayout(w, h, battle.flags[0].length, 90, h - 34, 44); }

  function drawBattle(w, h, t) {
    const b = battle, m = MAP[b.node], ter = TERRAIN[m.terrain];
    const L = battleLayout(w, h);
    b.layout = L;
    const cw = Math.min(w - 32, 488), x0 = (w - cw) / 2;
    drawField(w, h, L);
    ctx.fillStyle = "rgba(20,10,40,.55)"; ctx.fillRect(0, 0, w, 84);
    closeButton(x0, 14, retreat);
    soundButton(x0 + 50, 14);
    text(`${b.defense ? "Defend" : "Attack"} ${m.name}`, w / 2 + 30, 32, 16, 900, "#fff");
    text(`${ter.name}  ·  armies of ${b.target}`, w / 2 + 30, 50, 12, 700, "rgba(255,255,255,.75)");
    commanderRow(w / 2, 70, ARMY[1].name, b.target - b.scores[0], b.target, ARMY[1].light);

    const hidden = b.phase === "countdown" || b.phase === "intro";
    const playing = b.phase === "playing";
    const scoutIdx = t < b.scoutUntil && playing ? matchingFlag(1) : -1;
    drawArmies(L, t, {
      flags: b.flags, sizes: b.sizes, pos: b.pos, prev: b.prev, moveAt: b.moveAt,
      rise: hidden ? 0 : clamp01((t - b.raiseAt) / RAISE_MS),
      frozen: [t < b.frozenUntil, t < b.aiFrozenUntil],
      volley: b.volley, glow: scoutIdx >= 0 ? { side: 1, idx: scoutIdx } : null,
      spin: b.cfg.spin, sway: b.cfg.wheels, shake: [shake(b.shakeAt), 0],
      onTap: [null, playing && t >= b.frozenUntil ? (i, x, y) => playerTap(i, x, y) : null]
    });
    drawBanner(w, L, t, hidden, b.banner, b.bannerSizes, b.cfg.wheels);
    if (b.volley) {
      if (b.volley.label === undefined) b.volley.label = b.volley.by === 0 ? "Hit!" : "";
      drawVolley(w, L, t, b.volley, b.pos[b.volley.side][b.volley.idx]);
    }

    // The enemy takes aim: a bar that fills as they close in.
    if (playing && t >= b.aiFrozenUntil) {
      const k = clamp01((t - b.aiStartAt) / (b.aiNextAt - b.aiStartAt));
      rrect(L.x0, 80, L.cw, 5, 2.5, "rgba(255,255,255,.18)");
      rrect(L.x0, 80, Math.max(5, L.cw * k), 5, 2.5, k > 0.8 ? "#FF4D5E" : "rgba(255,110,120,.9)");
    }

    const s = camp.s, kinds = ["scout", "frost", "rally"], bw = Math.min(110, (cw - 24) / 3);
    kinds.forEach((kind, i) => {
      const bx = w / 2 + (i - 1) * (bw + 12) - bw / 2, n = s.items[kind];
      const ok = playing && n > 0 && !(kind === "rally" && b.rallied);
      rrect(bx, L.aidsY, bw, 34, 17, ok ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.2)");
      text(`${ITEMS[kind].name} ×${n}`, bx + bw / 2, L.aidsY + 22, 13, 700, ok ? "#331F73" : "rgba(255,255,255,.6)");
      if (ok) buttons.push({ x: bx, y: L.aidsY, w: bw, h: 34, run: () => useItem(kind) });
    });

    commanderRow(w / 2, h - 16, "Your army", b.target - b.scores[1], b.target, ARMY[0].light);

    if (b.phase === "countdown") {
      const el = (t - b.countdownAt) / 1000;
      bigNumber(String(Math.max(1, COUNTDOWN_S - Math.floor(el))), w / 2, L.bannerTop + L.bannerH / 2, el - Math.floor(el));
    } else if (playing && t - b.goAt < 600) {
      bigNumber("Charge!", w / 2, L.bannerTop + L.bannerH / 2, (t - b.goAt) / 600);
    }

    if (b.phase === "intro") {
      const secs = (POWER_SECONDS[b.power] * DIFFICULTY[camp.s.diff].mul).toFixed(1);
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      panel(w, h, {
        title: `${b.defense ? "Defend" : "Attack"} ${m.name}`, subtitle: `${ter.name}  ·  Power ${b.power}`,
        body: `Two armies of ${b.target}. Every soldier raises a flag; exactly one enemy flag matches a symbol on the centre banner. Tap that soldier to shoot him. The Ash Legion hunts for your matching soldier, about every ${secs} seconds; the red bar shows them taking aim. ${ter.effect}`,
        primary: { label: "To battle!", run: () => { b.phase = "countdown"; b.countdownAt = now(); b.lastCount = -1; } },
        links: b.defense ? [] : [{ label: "Back to map", run: () => { screen = "conquest"; } }]
      });
    } else if (b.phase === "over") {
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      const title = b.won ? (b.defense ? `${m.name} holds!` : b.node === DREAD ? "Dreadspire falls!" : "Victory!") : (b.defense ? "Defeat" : "Retreat");
      const body = b.won
        ? (b.defense ? `You beat back the Ash Legion. +${20 * b.power} gold.` : `${m.name} is yours. +${25 * b.power} gold.`)
        : (b.defense ? (b.node === HOME ? "The Ash Legion broke through to Highkeep." : `${m.name} falls to the Ash Legion.`) : "Your army falls back to regroup. Try again next turn.");
      panel(w, h, {
        title, body: `${b.target - b.scores[1]} of your soldiers stand, ${b.target - b.scores[0]} of theirs. ${body}`,
        primary: { label: "Continue", run: applyBattle }, links: []
      });
    }
  }

  // ------------------------------------------------------------ Battle: armies on one phone
  // Two players face each other across a phone lying flat. Player 2's army stands at the top,
  // upside down so it faces them. Each player shoots the OTHER army's soldier whose flag matches
  // a symbol on the centre banner: Player 1 taps the top army, Player 2 the bottom one.
  const armyDuel = {
    deck: FULL, dealer: new Dealer(FULL), center: 0, cards: [0, 0], banner: [], flags: [[], []],
    scores: [0, 0], phase: "ready", frozenUntil: [LONG_AGO, LONG_AGO], shakeAt: [LONG_AGO, LONG_AGO],
    volley: null, raiseAt: LONG_AGO, countdownAt: LONG_AGO, lastCount: -1, goAt: LONG_AGO, winner: -1,
    reset() {
      this.dealer = new Dealer(this.deck);
      this.scores = [0, 0]; this.phase = "ready"; this.volley = null; this.winner = -1;
      this.frozenUntil = [LONG_AGO, LONG_AGO];
      this.newRound(now());
    },
    newRound(t) {
      const d = this.dealer, c = d.draw(), a = d.draw(c), b = d.draw(c, a);
      this.center = c; this.cards = [a, b];
      this.banner = shuffle([...this.deck.cards[c]]);
      this.flags = [shuffle([...this.deck.cards[a]]), shuffle([...this.deck.cards[b]])];
      this.raiseAt = t;
    },
    start() { this.reset(); this.phase = "countdown"; this.countdownAt = now(); this.lastCount = -1; }
  };
  armyDuel.reset();

  function openArmyDuel() { armyDuel.reset(); screen = "armyduel"; }

  /** Player `shooter` (0 bottom, 1 top) taps soldier i of the other army. */
  function armyDuelTap(shooter, i, x, y) {
    const a = armyDuel, t = now();
    if (a.phase !== "playing" || t < a.frozenUntil[shooter]) return;
    const side = 1 - shooter, sym = a.flags[side][i];
    if (sym === shared(a.deck, a.center, a.cards[side])) {
      a.scores[shooter]++;
      a.volley = { by: shooter, side, idx: i, at: t, label: "Hit!", flipLabel: shooter === 1 };
      a.phase = "volley";
      sound.match(); haptic(15);
    } else {
      a.frozenUntil[shooter] = t + FREEZE_MS; a.shakeAt[shooter] = t;
      sound.freeze(); haptic([30, 40, 30]);
      xMark(x, y, shooter === 1);
    }
  }

  function updateArmyDuel(t) {
    if (screen !== "armyduel") return;
    const a = armyDuel;
    if (a.phase === "countdown") {
      const e = (t - a.countdownAt) / 1000, n = COUNTDOWN_S - Math.floor(e);
      if (e >= COUNTDOWN_S) { a.phase = "playing"; a.goAt = t; a.raiseAt = t; sound.go(); }
      else if (n !== a.lastCount) { a.lastCount = n; sound.tick(); }
    } else if (a.phase === "volley" && t - a.volley.at >= VOLLEY_MS) {
      const by = a.volley.by;
      a.volley = null;
      if (a.scores[by] >= ARMY_TARGET) { a.phase = "over"; a.winner = by; sound.win(); confetti(W); }
      else { a.phase = "playing"; a.newRound(t); }
    }
  }

  function drawArmyDuel(w, h, t) {
    const a = armyDuel;
    const L = armyLayout(w, h, a.flags[0].length, 46, h - 46, 0);
    drawField(w, h, L);
    const hidden = a.phase === "ready" || a.phase === "countdown";
    const playing = a.phase === "playing";
    // Player 2's pips, upside down at the top; Player 1's at the bottom. Pips = soldiers standing.
    ctx.save(); ctx.translate(w / 2, 22); ctx.rotate(Math.PI); ctx.translate(-w / 2, -22);
    commanderRow(w / 2, 22, "Player 2", ARMY_TARGET - a.scores[0], ARMY_TARGET, ARMY[1].light);
    ctx.restore();
    commanderRow(w / 2, h - 22, "Player 1", ARMY_TARGET - a.scores[1], ARMY_TARGET, ARMY[0].light);

    drawArmies(L, t, {
      flags: a.flags, rise: hidden ? 0 : clamp01((t - a.raiseAt) / RAISE_MS),
      frozen: [t < a.frozenUntil[0], t < a.frozenUntil[1]], volley: a.volley, flipTop: true,
      shake: [shake(a.shakeAt[0]), -shake(a.shakeAt[1])],
      onTap: playing ? [(i, x, y) => armyDuelTap(1, i, x, y), (i, x, y) => armyDuelTap(0, i, x, y)] : null
    });
    drawBanner(w, L, t, hidden, a.banner, null, false);
    drawVolley(w, L, t, a.volley);
    closeButton(8, L.bannerTop + L.bannerH / 2 - 20, () => { screen = "menu"; });
    soundButton(w - 48, L.bannerTop + L.bannerH / 2 - 20);

    if (a.phase === "countdown") {
      const el = (t - a.countdownAt) / 1000;
      bigNumber(String(Math.max(1, COUNTDOWN_S - Math.floor(el))), w / 2, L.bannerTop + L.bannerH / 2, el - Math.floor(el));
    } else if (playing && t - a.goAt < 600) {
      bigNumber("Charge!", w / 2, L.bannerTop + L.bannerH / 2, (t - a.goAt) / 600);
    }

    if (a.phase === "ready") {
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      panel(w, h, {
        title: "Battle", subtitle: "Two armies, one phone",
        body: `Lay the phone flat between you. Every soldier raises a flag. Shoot the other army's soldier whose flag matches a symbol on the centre banner: Player 1 taps the top army, Player 2 the bottom one. A wrong tap lowers your flags for a moment. Wipe out the other army of ${ARMY_TARGET} to win.`,
        primary: { label: "To battle!", run: () => a.start() },
        links: [{ label: "Menu", run: () => { screen = "menu"; } }]
      });
    } else if (a.phase === "over") {
      ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, w, h);
      buttons.push({ x: 0, y: 0, w, h, run: () => {} });
      const title = `Player ${a.winner + 1} wins!`, score = `${ARMY_TARGET - a.scores[1]} – ${ARMY_TARGET - a.scores[0]} soldiers standing`;
      const bw = Math.min(w - 32, 320);
      ctx.save(); ctx.translate(w / 2, h * 0.2); ctx.rotate(Math.PI); ctx.translate(-w / 2, -h * 0.2);
      winBanner(title, score, w / 2, h * 0.2, bw);
      ctx.restore();
      winBanner(title, score, w / 2, h * 0.8, bw);
      rrect((w - bw) / 2, h / 2 - 66, bw, 132, 28, "rgba(51,31,115,.92)");
      bigButton((w - bw) / 2 + 24, h / 2 - 46, bw - 48, 52, "Rematch", false, () => a.start());
      text("Menu", w / 2, h / 2 + 40, 17, 700, "#fff");
      buttons.push({ x: w / 2 - 60, y: h / 2 + 14, w: 120, h: 46, run: () => { screen = "menu"; } });
    }
  }

  // ------------------------------------------------------------ Input
  function haptic(pattern) { try { navigator.vibrate?.(pattern); } catch {} }

  function soloTap(sym, sx, sy) {
    const res = round.tap(sym);
    if (res === "match") {
      sound.match(); haptic(15);
      burst(sx, sy, colorOf(sym));
      floatText("+1", sx, sy - 12, "#fff", false);
      // Crossing a star threshold mid-round.
      if (round.level >= 0 && round.cfg.stars.includes(round.score)) sound.star();
    } else if (res === "miss") {
      sound.miss(); haptic([30, 40, 30]);
      xMark(sx, sy, false);
      floatText(`−${round.cfg.penalty}s`, sx, sy - 12, "#FFD1D6", false);
      if (round.phase === "over") onRoundOver();
    }
  }

  function duelTap(p, sym, sx, sy) {
    const res = duel.tap(p, sym), flipped = p === 1;
    if (res === "match") {
      sound.match(); haptic(15);
      burst(sx, sy, colorOf(sym));
      floatText("+1", sx, sy + (flipped ? 12 : -12), "#fff", flipped);
      if (duel.winner >= 0) { sound.win(); confetti(W); }
    } else if (res === "miss") {
      sound.freeze(); haptic([30, 40, 30]);
      xMark(sx, sy, flipped);
    }
  }

  function tap(x, y) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) { b.run(); return; }
    }
    for (const h of hits) {
      const dx = x - h.cx, dy = y - h.cy;
      if (dx * dx + dy * dy > h.d * h.d / 4) continue;
      const cos = Math.cos(h.rot), sin = Math.sin(h.rot);
      let best = null, bestDist = Infinity, bx = 0, by = 0;
      for (const s of h.card.slots) {
        const [sx0, sy0] = slotXY(h.card, s);
        const px = h.cx + (sx0 * cos - sy0 * sin) * h.d, py = h.cy + (sx0 * sin + sy0 * cos) * h.d;
        const dist = Math.hypot(x - px, y - py);
        if (dist < s.size * h.d * 0.62 && dist < bestDist) { bestDist = dist; best = s; bx = px; by = py; }
      }
      if (best) h.onTap(best.symbol, bx, by);
      return;
    }
  }

  let wakeLock = null;
  function keepAwake() {
    if (wakeLock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener?.("release", () => { wakeLock = null; }); }).catch(() => {});
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    sound.unlock();
    const rect = canvas.getBoundingClientRect();
    tap(e.clientX - rect.left, e.clientY - rect.top);
    keepAwake();
  });
  for (const type of ["pointerup", "touchend", "click"]) {
    window.addEventListener(type, () => sound.unlock(), { passive: true });
  }
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("keydown", e => {
    sound.unlock();
    if (e.key === "Escape") {
      if (screen === "solo") { round.phase = "ready"; screen = round.level >= 0 ? "levels" : "menu"; }
      else if (screen === "match") leaveMatch();
      else if (screen === "battle") retreat();
      else if (screen === "armyduel") screen = "menu";
      else if (screen === "conquest") { if (camp.shop) camp.shop = false; else if (camp.sel >= 0) camp.sel = -1; else screen = "menu"; }
      else if (screen === "online") closeOnline();
      else screen = "menu";
    } else if (e.key === "m" || e.key === "M") sound.setMuted(!sound.muted);
    else if (e.key === " " || e.key === "Enter") {
      if (screen === "solo" && (round.phase === "ready" || round.phase === "over")) { round.start(); e.preventDefault(); }
      else if (screen === "duel" && duel.winner >= 0) { duel.reset(); e.preventDefault(); }
    }
  });

  requestAnimationFrame(frame);
})();
</script>
